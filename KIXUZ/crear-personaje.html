<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Crear Personaje</title>
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.88);
            --borde: rgba(108, 60, 224, 0.35);
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
        }
        header {
            position: relative;
            z-index: 900;
            background: rgba(21, 10, 36, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: nowrap;
            overflow: visible;
        }
        @media (max-width: 980px) {
            header { flex-wrap: wrap; }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--texto);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="display:inline-flex; align-items:center; text-decoration:none;">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height:36px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            <span style="display:none; color:var(--acento); font-weight:800;">KIXUZ</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
            <a href="cuenta-maestra.html">Cuenta Maestra</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html" class="btn-auth-link" title="Entrar / Registro" aria-label="Entrar / Registro" style="text-decoration:none;">🔑</a>
        </div>
    </header>
    <main id="appMain">
        <h1>KIXUZ — Crear Personaje</h1>
        <div id="feedPosts"></div>
    </main>
    <script type="module" src="firebase-config.js"></script>
    <script src="characters.js"></script>
    <script src="theme.js"></script>
    <script src="kixuz-72h-aviso.js"></script>
    <script src="kixuz-admin-master.js"></script>
    <script src="chat.js"></script>
</body>
</html>
