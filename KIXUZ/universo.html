<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Universos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.9);
            --borde: rgba(108, 60, 224, 0.38);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
            min-height: 100vh;
        }
        header {
            position: relative;
            z-index: 900;
            background: rgba(21, 10, 36, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: nowrap;
        }
        @media (max-width: 980px) {
            header { flex-wrap: wrap; }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--texto);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(108, 60, 224, 0.28);
            color: var(--acento);
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        main {
            max-width: 980px;
            margin: 24px auto;
            padding: 0 16px 60px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
        }
        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--acento);
            color: #150A24;
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-secondary {
            background: rgba(108, 60, 224, 0.25);
            color: var(--texto);
            border: 1px solid var(--borde);
        }
        .uni-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }
        .uni-card {
            background: rgba(21, 10, 36, 0.72);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tag-pill {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(45, 212, 196, 0.16);
            color: var(--acento);
            border: 1px solid rgba(45, 212, 196, 0.4);
        }
        .modal-box {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(21, 10, 36, 0.85);
            border: 1px solid var(--acento);
        }
        .modal-box.open { display: flex; flex-direction: column; gap: 10px; }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.3);
            color: var(--texto);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
        }
        .muted { opacity: 0.75; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="display:inline-flex; align-items:center; text-decoration:none;">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height:36px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            <span style="display:none; color:var(--acento); font-weight:800; font-family:'Unbounded',sans-serif;">KIXUZ</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html" class="active">Universos</a>
            <a href="familia.html">Familia / Clan</a>
            <a href="cuenta-maestra.html">Cuenta Maestra</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html" class="btn-auth-link" title="Entrar / Registro" aria-label="Entrar / Registro" style="text-decoration:none;">🔑</a>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="row-between">
                <div>
                    <h1 style="margin:0; font-family:'Space Grotesk',sans-serif; font-size:24px;">KIXUZ — Universos</h1>
                    <p class="muted" style="margin:4px 0 0;">Explorá los universos aprobados o enviá una solicitud para crear uno nuevo (su aprobación depende de Kixuz).</p>
                </div>
                <button type="button" class="btn" id="btnToggleCreateUni">+ Solicitar Universo</button>
            </div>

            <div class="modal-box" id="requestUniverseBox">
                <strong>Solicitar creación de Universo</strong>
                <input type="text" id="uniNombreInput" placeholder="Nombre del universo (ej. Ciudad Neo-Luz)">
                <input type="text" id="uniTagInput" placeholder="Etiqueta #Hashtag (ej. #NeoLuz)">
                <textarea id="uniDescInput" rows="2" placeholder="Descripción, temática o reglas breves..."></textarea>
                <div style="display:flex; justify-content:flex-end; gap:8px;">
                    <button type="button" class="btn btn-secondary" id="btnCancelUni">Cancelar</button>
                    <button type="button" class="btn" id="btnSendUniReq">Enviar solicitud</button>
                </div>
                <div id="uniReqMsg" class="muted"></div>
            </div>

            <div id="universesGrid" class="uni-grid"></div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script src="theme.js"></script>
    <script src="kixuz-72h-aviso.js"></script>
    <script src="kixuz-admin-master.js"></script>
    <script src="chat.js"></script>
    <script>
        (() => {
            const UNI_KEY = 'kixuz_universos_aprobados_v1';
            const SOL_KEY = 'kixuz_solicitudes_universo_v1';

            const esc = s => String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            const norm = v => String(v || '').trim().toLowerCase();

            function esKixuz() {
                if (window.KIXUZ_DB?.esAdmin) return true;
                const p = window.KIXUZ_DB?.perfilCuenta || {};
                const u = window.KIXUZ_DB?.usuarioActual || {};
                let loc = {};
                try { loc = JSON.parse(localStorage.getItem('kixuz_usuario_local') || '{}') || {}; } catch {}
                const n = norm(p.nombreMaestro || u.displayName || loc.nombreMaestro || loc.nombre || '');
                const e = norm(p.email || u.email || loc.email || '');
                return p.rolSistema === 'admin' || loc.rolSistema === 'admin' || n === 'kixuz' || e.startsWith('kixuz@');
            }

            function getUniversos() {
                let list = [];
                try { list = JSON.parse(localStorage.getItem(UNI_KEY) || '[]'); } catch { list = []; }
                if (!Array.isArray(list)) list = [];
                // Si el usuario es Kixuz, incluir #Kixuz; para los demás usuarios no mostrar #Kixuz como universo seleccionable
                const admin = esKixuz();
                const sinKixuz = list.filter(u => norm(u.tag || u.nombre) !== '#kixuz' && norm(u.tag || u.nombre) !== 'kixuz');
                if (admin) {
                    return [{ id: 'uni_kixuz', nombre: 'Kixuz Oficial', tag: '#Kixuz', descripcion: 'Avisos y actualizaciones oficiales de la cuenta maestra Kixuz (72h).' }, ...sinKixuz];
                }
                return sinKixuz;
            }

            function renderUniversos() {
                const grid = document.getElementById('universesGrid');
                if (!grid) return;
                const unis = getUniversos();
                if (!unis.length) {
                    grid.innerHTML = `<div class="muted" style="grid-column:1/-1; padding:12px;">Todavía no hay universos aprobados en el directorio. Tocá <strong>+ Solicitar Universo</strong> para pedir uno.</div>`;
                    return;
                }
                grid.innerHTML = '';
                unis.forEach(u => {
                    const card = document.createElement('div');
                    card.className = 'uni-card';
                    card.innerHTML = `
                        <div><span class="tag-pill">${esc(u.tag || '#Universo')}</span></div>
                        <div style="font-weight:700; font-size:16px;">${esc(u.nombre || 'Universo')}</div>
                        <div class="muted">${esc(u.descripcion || 'Universo del multiverso KIXUZ.')}</div>
                    `;
                    grid.appendChild(card);
                });
            }

            const box = document.getElementById('requestUniverseBox');
            document.getElementById('btnToggleCreateUni').addEventListener('click', () => {
                box.classList.toggle('open');
            });
            document.getElementById('btnCancelUni').addEventListener('click', () => {
                box.classList.remove('open');
            });
            document.getElementById('btnSendUniReq').addEventListener('click', () => {
                const nombre = document.getElementById('uniNombreInput').value.trim();
                let tag = document.getElementById('uniTagInput').value.trim();
                const descripcion = document.getElementById('uniDescInput').value.trim();
                const msgEl = document.getElementById('uniReqMsg');
                if (!nombre) {
                    msgEl.textContent = 'Ingresá un nombre para el universo.';
                    return;
                }
                if (!tag) tag = '#' + nombre.replace(/[^a-zA-Z0-9]/g, '');
                if (!tag.startsWith('#')) tag = '#' + tag;

                let sols = [];
                try { sols = JSON.parse(localStorage.getItem(SOL_KEY) || '[]'); } catch { sols = []; }
                if (!Array.isArray(sols)) sols = [];
                sols.unshift({
                    id: 'sol_' + Date.now(),
                    nombre,
                    tag,
                    descripcion,
                    estado: 'pendiente'
                });
                try { localStorage.setItem(SOL_KEY, JSON.stringify(sols)); } catch {}

                document.getElementById('uniNombreInput').value = '';
                document.getElementById('uniTagInput').value = '';
                document.getElementById('uniDescInput').value = '';
                msgEl.textContent = '✓ Solicitud enviada. Queda pendiente de aprobación de la cuenta maestra Kixuz.';
                window.dispatchEvent(new Event('kixuz:universos-actualizados'));
            });

            window.addEventListener('DOMContentLoaded', renderUniversos);
            window.addEventListener('kixuz:sesion-actualizada', renderUniversos);
            window.addEventListener('kixuz:universos-actualizados', renderUniversos);
        })();
    </script>
</body>
</html>
