<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Inicio y Muro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.88);
            --borde: rgba(108, 60, 224, 0.35);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
        }
        header {
            background-color: rgba(0, 0, 0, 0.68);
            padding: 10px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--acento);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 10px;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .dropdown {
            background-color: var(--bg-secundario);
            color: var(--texto);
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid var(--acento);
            cursor: pointer;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12.5px;
        }
        main {
            max-width: 820px;
            margin: 24px auto;
            padding: 0 16px 60px;
        }
        .composer-card, .post-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        html[data-theme="light"] .composer-card,
        html[data-theme="light"] .post-card {
            background: rgba(255, 255, 255, 0.9);
            color: #150A24;
        }
        .composer-textarea {
            width: 100%;
            min-height: 76px;
            resize: vertical;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.25);
            color: var(--texto);
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .composer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: var(--acento);
            color: #150A24;
            border: none;
            border-radius: 10px;
            padding: 8px 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .post-author {
            color: var(--acento);
            font-weight: 700;
            text-decoration: none;
        }
        .post-body {
            white-space: pre-wrap;
            line-height: 1.5;
            margin: 6px 0 10px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 34px;">
        </a>
        <nav class="nav-links">
            <a href="index.html" class="active">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" class="dropdown" aria-label="Personaje activo"></select>
            <a href="registro.html" title="Entrar / Registro">Entrar</a>
        </div>
    </header>

    <main id="appMain">
        <section class="composer-card">
            <form id="feedComposerForm">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                    <strong id="postingAsBadge">Publicando como @rol</strong>
                    <input type="text" id="targetWallInput" placeholder="Muro destino opcional (ej. @otro_pj)" style="padding:5px 9px; border-radius:8px; border:1px solid var(--borde); background:rgba(0,0,0,0.25); color:inherit; font-size:12.5px;">
                </div>
                <textarea id="feedPostTextarea" class="composer-textarea" placeholder="Escribí algo o etiquetá @usuario... (Shift + Enter: salto de línea)"></textarea>
                <div class="composer-bar">
                    <span style="font-size:12px; opacity:0.75;">Enter envía · Shift + Enter baja de línea</span>
                    <button type="submit" class="btn-primary">Publicar</button>
                </div>
            </form>
        </section>

        <section id="feedPosts"></section>
    </main>

    <script src="navbar-ui.js"></script>
    <script src="theme.js"></script>
    <script src="characters.js"></script>
    <script src="buscador-global.js"></script>
    <script src="interacciones-muro.js"></script>
    <script src="notificaciones.js"></script>
    <script src="chat.js"></script>
    <script type="module" src="firebase-config.js"></script>

    <script>
        (() => {
            const POSTS_KEY = 'kixuz_posts_v1';
            const normH = v => {
                const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
                return s ? '@' + s : '';
            };
            const esc = s => String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            function leerPosts() {
                try {
                    const arr = JSON.parse(localStorage.getItem(POSTS_KEY) || '[]');
                    return Array.isArray(arr) ? arr : [];
                } catch { return []; }
            }

            function guardarPosts(arr) {
                try { localStorage.setItem(POSTS_KEY, JSON.stringify(arr.slice(0, 200))); } catch {}
            }

            function actualizarBadge() {
                const actor = window.KIXUZ_INTERACCIONES?.obtenerActorActual
                    ? window.KIXUZ_INTERACCIONES.obtenerActorActual()
                    : { nombre: 'Invitado', handle: '@invitado' };
                const badge = document.getElementById('postingAsBadge');
                if (badge) badge.textContent = `Publicando como ${actor.nombre} (${actor.handle})`;
            }

            function renderFeed() {
                const cont = document.getElementById('feedPosts');
                if (!cont) return;
                const posts = leerPosts();
                cont.innerHTML = '';

                if (!posts.length) {
                    cont.innerHTML = `<div class="post-card" style="opacity:0.78;">Aún no hay publicaciones. ¡Escribí la primera arriba!</div>`;
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('article');
                    card.className = 'post-card';
                    const autorHref = `perfil.html?char=${encodeURIComponent(post.autorHandle || '')}`;
                    const muroLabel = post.muroHandle && normH(post.muroHandle) !== normH(post.autorHandle)
                        ? ` &gt; <a href="perfil.html?char=${encodeURIComponent(normH(post.muroHandle))}" class="post-author">${esc(normH(post.muroHandle))}</a>`
                        : '';

                    const cuerpoHtml = window.KIXUZ_INTERACCIONES?.formatearTextoConMenciones
                        ? window.KIXUZ_INTERACCIONES.formatearTextoConMenciones(post.contenido || '')
                        : esc(post.contenido || '');

                    card.innerHTML = `
                        <div class="post-header">
                            <div>
                                <a href="${autorHref}" class="post-author">${esc(post.autorNombre || 'Personaje')}</a>
                                <span style="opacity:0.7; font-size:12.5px;">${esc(post.autorHandle || '')}</span>
                                ${muroLabel}
                            </div>
                        </div>
                        <div class="post-body">${cuerpoHtml}</div>
                        <div class="post-interacciones"></div>
                    `;

                    const interSlot = card.querySelector('.post-interacciones');
                    if (window.KIXUZ_INTERACCIONES?.montarBloqueInteracciones) {
                        window.KIXUZ_INTERACCIONES.montarBloqueInteracciones(interSlot, post, () => renderFeed());
                    }
                    cont.appendChild(card);
                });
            }

            const form = document.getElementById('feedComposerForm');
            const ta = document.getElementById('feedPostTextarea');
            ta.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    form.requestSubmit();
                }
            });

            form.addEventListener('submit', e => {
                e.preventDefault();
                const contenido = String(ta.value || '').replace(/^\n+|\n+$/g, '');
                if (!contenido.trim()) return;

                const actor = window.KIXUZ_INTERACCIONES?.obtenerActorActual
                    ? window.KIXUZ_INTERACCIONES.obtenerActorActual()
                    : { nombre: 'Invitado', handle: '@invitado', uid: '' };

                const muroInput = document.getElementById('targetWallInput').value;
                const muroHandle = normH(muroInput) || actor.handle;

                const nuevoPost = {
                    id: 'post_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    autorNombre: actor.nombre,
                    autorHandle: actor.handle,
                    autorUid: actor.uid,
                    muroHandle,
                    contenido,
                    kixiz: 0,
                    kixPorUsuario: [],
                    respuestas: [],
                    creadoEn: Date.now()
                };

                const posts = leerPosts();
                posts.unshift(nuevoPost);
                guardarPosts(posts);
                ta.value = '';
                document.getElementById('targetWallInput').value = '';
                renderFeed();
            });

            window.addEventListener('kixuz:personajes-actualizados', () => {
                actualizarBadge();
                renderFeed();
            });
            window.addEventListener('kixuz:sesion-actualizada', () => {
                actualizarBadge();
                renderFeed();
            });
            document.addEventListener('DOMContentLoaded', () => {
                actualizarBadge();
                renderFeed();
            });
            actualizarBadge();
            renderFeed();
        })();
    </script>
</body>
</html>
