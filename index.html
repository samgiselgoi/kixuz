<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIXUZ — Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-principal: #150A24;
      --bg: #150A24;
      --bg-secundario: #6C3CE0;
      --card: #1F1135;
      --card-2: #281644;
      --border: rgba(108, 60, 224, 0.35);
      --primary: #6C3CE0;
      --accent: #2DD4C4;
      --acento: #2DD4C4;
      --texto: #EDE7E0;
      --muted: rgba(237, 231, 224, 0.68);
    }
    html[data-theme="light"] {
      --bg-principal: #F4F1FA;
      --bg: #F4F1FA;
      --card: #FFFFFF;
      --card-2: #EFE9FA;
      --border: rgba(108, 60, 224, 0.25);
      --texto: #150A24;
      --muted: rgba(21, 10, 36, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: rgba(21, 10, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
    .brand, .logo { display: inline-flex; align-items: center; text-decoration: none; flex-shrink: 0; }

    .feed-container {
      max-width: 780px;
      margin: 24px auto 90px;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .create-post {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }
    .create-post textarea {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 76px;
    }
    .create-post-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .create-post-controls select,
    .create-post-controls input {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
    }
    .create-post-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .btn-publish {
      height: 36px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: var(--acento);
      color: #150A24;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .mode-switch-group {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
    }
    .mode-btn.active.ic { background: var(--acento); color: #150A24; }
    .mode-btn.active.oc { background: var(--bg-secundario); color: #EDE7E0; }
    .mode-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .mode-badge.ic { background: rgba(45, 212, 196, 0.18); color: var(--acento); border: 1px solid rgba(45, 212, 196, 0.45); }
    .mode-badge.oc { background: rgba(108, 60, 224, 0.25); color: #c4b0ff; border: 1px solid rgba(108, 60, 224, 0.55); }

    @keyframes kixFlamePulse {
      0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 2px rgba(255, 138, 43, 0.45)); }
      50% { transform: scale(1.13) translateY(-1px); filter: drop-shadow(0 0 7px rgba(255, 102, 51, 0.85)); }
    }
    .kix-flame-svg { width: 15px; height: 15px; flex-shrink: 0; }
    .kix-btn.liked .kix-flame-svg { animation: kixFlamePulse 1.15s ease-in-out infinite; }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .post-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .post-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(108, 60, 224, 0.22);
      border: 1px solid var(--border);
      color: var(--acento);
    }
    .kix-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108, 60, 224, 0.18);
      border: 1px solid var(--border);
      color: var(--texto);
      border-radius: 8px;
      padding: 5px 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .kix-btn.liked { border-color: #ff7b39; background: rgba(255, 123, 57, 0.16); color: #ffa672; }
    .comment-form { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
    .comment-form input {
      flex: 1;
      min-width: 150px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--texto);
      font-size: 12.5px;
      outline: none;
    }
    .comment-btn {
      background: rgba(108, 60, 224, 0.26);
      border: 1px solid var(--border);
      color: var(--texto);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand" aria-label="KIXUZ Inicio">
      <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 34px;">
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="perfil.html">Mi Personaje</a>
      <a href="universo.html">Universos</a>
      <a href="familia.html">Familia / Clan</a>
    </nav>
    <div class="user-menu">
      <select id="activeCharSelect" aria-label="Personaje activo"></select>
      <a href="registro.html">Entrar</a>
    </div>
  </header>

  <main class="feed-container">
    <section class="create-post" id="homeCreatePost">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
        <div id="homeComposerHint" style="font-size:12px;color:var(--acento);font-weight:700;"></div>
        <div class="mode-switch-group" id="homePostModeSwitch" data-mode="IC">
          <button type="button" class="mode-btn ic active" data-hmode="IC">IC</button>
          <button type="button" class="mode-btn oc" data-hmode="OC">OC</button>
        </div>
      </div>
      <textarea id="homeWallInput" placeholder="Escribe una escena o publicación para el inicio..."></textarea>
      <div class="create-post-controls">
        <select id="homePostUniverse" aria-label="Universo">
          <option value="">Sin universo (solo muro/inicio)</option>
        </select>
        <select id="homePostScope" aria-label="Visibilidad / Familia o Clan">
          <option value="global">Público</option>
          <option value="familia">Familia / Clan</option>
        </select>
        <input type="text" id="homePostFamilyTag" placeholder="Vínculo familiar o clan (opcional)">
      </div>
      <div class="create-post-footer">
        <button type="button" class="btn-publish" id="homeWallPublish">Publicar</button>
      </div>
    </section>

    <div id="homeWallFeed"></div>
  </main>

  <script>
    (() => {
      const SVG_FLAME = `
        <svg class="kix-flame-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2.5c2.5 3.4 5.5 5.6 5.5 10.2a5.5 5.5 0 0 1-11 0c0-2.6 1.2-4.6 2.8-6.4-.2 1.8.6 3.1 1.7 3.5-.3-2.5.4-5.2 1-7.3z"></path>
        </svg>
      `;

      const esc = s => String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      const normH = v => {
        const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
        return s ? '@' + s : '';
      };

      let likedSet = new Set();

      document.querySelectorAll('#homePostModeSwitch .mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = btn.dataset.hmode;
          const sw = document.getElementById('homePostModeSwitch');
          sw.dataset.mode = m;
          sw.querySelector('[data-hmode="IC"]').classList.toggle('active', m === 'IC');
          sw.querySelector('[data-hmode="OC"]').classList.toggle('active', m === 'OC');
        });
      });

      function getAutorActual(modo) {
        if (modo === 'OC') {
          return { nombre: window.KIXUZ_DB?.perfilCuenta?.apodo || 'Usuario OC', handle: '@oc' };
        }
        const ac = window.KIXUZ_ACTIVE_CHAR;
        if (ac && !ac.esPlaceholder && ac.handle) {
          return { nombre: ac.nombre || ac.handle.slice(1), handle: normH(ac.handle) };
        }
        try {
          const act = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
          if (act?.handle) return { nombre: act.nombre || act.handle.slice(1), handle: normH(act.handle) };
        } catch {}
        return { nombre: 'Invitado', handle: '@invitado' };
      }

      function sincronizarUniversosComposer() {
        const sel = document.getElementById('homePostUniverse');
        const hint = document.getElementById('homeComposerHint');
        const autor = getAutorActual('IC');
        if (hint) hint.textContent = `Publicando como ${autor.nombre} (${autor.handle})`;
        if (!sel) return;
        const tags = new Set(['#Kixuz']);
        if (window.KIXUZ_UNIVERSOS?.leerUniversos) {
          try {
            window.KIXUZ_UNIVERSOS.leerUniversos().forEach(u => { if (u?.tag) tags.add(u.tag); });
          } catch {}
        }
        sel.innerHTML = `<option value="">Sin universo (solo muro/inicio)</option>` +
          Array.from(tags).map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
      }

      function renderInicioFeed() {
        sincronizarUniversosComposer();
        const feed = document.getElementById('homeWallFeed');
        if (!feed) return;

        let posts = [];
        try {
          const p1 = JSON.parse(localStorage.getItem('kixuz_posts_v1') || '[]');
          const p2 = JSON.parse(localStorage.getItem('kixuz_posts') || '[]');
          const mapa = new Map();
          [...(Array.isArray(p1) ? p1 : []), ...(Array.isArray(p2) ? p2 : [])].forEach(it => {
            if (it && it.id) mapa.set(String(it.id), it);
          });
          posts = Array.from(mapa.values()).sort((a, b) => Number(b.createdAtMs || 0) - Number(a.createdAtMs || 0));
        } catch {}

        feed.innerHTML = posts.length
          ? posts.map(p => {
              const idPost = esc(p.id);
              const count = Number(p.kixiz ?? p.kix ?? 0);
              const labelKix = count === 1 ? 'Kix' : 'Kixiz';
              const isLiked = likedSet.has(String(p.id));
              const modoPost = p.modo === 'OC' ? 'OC' : 'IC';
              const respuestas = Array.isArray(p.respuestas) ? p.respuestas : [];
              const uni = p.universo || p.universe || '';
              const famTag = p.familiaClanTag || p.alcanceValor || '';
              const scope = p.alcanceTipo || '';
              const autorH = normH(p.autorHandle || p.handle || '');

              return `
                <article class="post-card" data-post-id="${idPost}">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                      <a href="perfil.html?char=${encodeURIComponent(autorH)}" style="text-decoration:none;color:var(--acento);font-weight:700;">
                        ${esc(p.autorNombre || p.author || 'Personaje')} <span style="opacity:0.75;font-size:12px;">(${esc(autorH)})</span>
                      </a>
                      <span class="mode-badge ${modoPost === 'OC' ? 'oc' : 'ic'}">${modoPost}</span>
                    </div>
                    <span style="font-size:12px;color:var(--muted);">${esc(p.tiempo || p.time || 'Reciente')}</span>
                  </div>
                  <div class="post-badges">
                    ${uni ? `<a href="universo.html?u=${encodeURIComponent(String(uni).replace(/^#/, ''))}" class="post-pill">${esc(uni)}</a>` : ''}
                    ${(scope === 'familia' || famTag) ? `<a href="familia.html?char=${encodeURIComponent(autorH)}" class="post-pill">Familia / Clan${famTag ? ': ' + esc(famTag) : ''}</a>` : ''}
                  </div>
                  <p style="line-height:1.55;white-space:pre-line;">${esc(p.contenido || p.text || '')}</p>
                  <div>
                    <button type="button" class="kix-btn ${isLiked ? 'liked' : ''}" data-kix-post="${idPost}">${SVG_FLAME}<span>${esc(labelKix)} (${count})</span></button>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:5px;margin-top:2px;">
                    ${respuestas.map(r => {
                      const rModo = r.modo === 'OC' ? 'OC' : 'IC';
                      return `<div style="background:rgba(0,0,0,0.2);border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;"><span><strong>${esc(r.autorNombre || r.autorHandle || 'Rol')}:</strong> ${esc(r.texto)}</span><span class="mode-badge ${rModo === 'OC' ? 'oc' : 'ic'}">${rModo}</span></div>`;
                    }).join('')}
                    <form class="comment-form" data-comment-post-id="${idPost}">
                      <input type="text" placeholder="Escribir comentario..." required>
                      <div class="mode-switch-group" data-comment-mode="IC">
                        <button type="button" class="mode-btn ic active" data-cmode="IC">IC</button>
                        <button type="button" class="mode-btn oc" data-cmode="OC">OC</button>
                      </div>
                      <button type="submit" class="comment-btn">Comentar</button>
                    </form>
                  </div>
                </article>
              `;
            }).join('')
          : `<div class="post-card" style="color:var(--muted);font-size:14px;">Sin publicaciones en el inicio todavía.</div>`;

        feed.querySelectorAll('.kix-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const postId = btn.dataset.kixPost;
            const ya = likedSet.has(String(postId));
            const delta = ya ? -1 : 1;
            if (ya) likedSet.delete(String(postId));
            else likedSet.add(String(postId));
            ['kixuz_posts', 'kixuz_posts_v1'].forEach(key => {
              try {
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                if (!Array.isArray(arr)) return;
                let changed = false;
                arr.forEach(item => {
                  if (String(item.id) === String(postId)) {
                    item.kixiz = Math.max(0, Number(item.kixiz ?? item.kix ?? 0) + delta);
                    changed = true;
                  }
                });
                if (changed) localStorage.setItem(key, JSON.stringify(arr));
              } catch {}
            });
            renderInicioFeed();
          });
        });

        feed.querySelectorAll('.comment-form').forEach(form => {
          const cSwitch = form.querySelector('.mode-switch-group');
          cSwitch?.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const m = btn.dataset.cmode;
              cSwitch.dataset.commentMode = m;
              cSwitch.querySelector('[data-cmode="IC"]').classList.toggle('active', m === 'IC');
              cSwitch.querySelector('[data-cmode="OC"]').classList.toggle('active', m === 'OC');
            });
          });

          form.addEventListener('submit', e => {
            e.preventDefault();
            const postId = form.dataset.commentPostId;
            const inp = form.querySelector('input');
            const texto = (inp.value || '').trim();
            if (!texto) return;
            const cModo = cSwitch?.dataset.commentMode === 'OC' ? 'OC' : 'IC';
            const autor = getAutorActual(cModo);

            ['kixuz_posts', 'kixuz_posts_v1'].forEach(key => {
              try {
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                if (!Array.isArray(arr)) return;
                let changed = false;
                arr.forEach(item => {
                  if (String(item.id) === String(postId)) {
                    item.respuestas = Array.isArray(item.respuestas) ? item.respuestas : [];
                    item.respuestas.push({ autorNombre: autor.nombre, autorHandle: autor.handle, modo: cModo, texto });
                    changed = true;
                  }
                });
                if (changed) localStorage.setItem(key, JSON.stringify(arr));
              } catch {}
            });
            inp.value = '';
            renderInicioFeed();
          });
        });
      }

      document.getElementById('homeWallPublish')?.addEventListener('click', () => {
        const input = document.getElementById('homeWallInput');
        const uniSel = document.getElementById('homePostUniverse');
        const scopeSel = document.getElementById('homePostScope');
        const famInp = document.getElementById('homePostFamilyTag');
        const modeSw = document.getElementById('homePostModeSwitch');
        const txt = (input?.value || '').trim();
        if (!txt) return;

        const modo = modeSw?.dataset.mode === 'OC' ? 'OC' : 'IC';
        const autor = getAutorActual(modo);

        const nuevo = {
          id: 'post_' + Date.now(),
          autorNombre: autor.nombre,
          autorHandle: autor.handle,
          modo,
          contenido: txt,
          universo: (uniSel?.value || '').trim(),
          alcanceTipo: scopeSel?.value || 'global',
          alcanceValor: (famInp?.value || '').trim(),
          createdAtMs: Date.now(),
          tiempo: 'Ahora mismo',
          kixiz: 0,
          respuestas: []
        };

        let posts = [];
        try { posts = JSON.parse(localStorage.getItem('kixuz_posts') || '[]'); } catch {}
        posts.unshift(nuevo);
        localStorage.setItem('kixuz_posts', JSON.stringify(posts));
        input.value = '';
        if (famInp) famInp.value = '';
        renderInicioFeed();
      });

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderInicioFeed);
      else renderInicioFeed();
      window.addEventListener('kixuz:personajes-actualizados', renderInicioFeed);
    })();
  </script>

  <script src="chat.js"></script>
  <script src="theme.js"></script>
  <script src="characters.js"></script>
  <script src="universos-core.js"></script>
  <script src="buscador-global.js"></script>
  <script src="navbar-ui.js"></script>
  <script src="notificaciones.js"></script>
  <script src="amigos.js"></script>
  <script type="module" src="firebase-config.js"></script>
</body>
</html>
