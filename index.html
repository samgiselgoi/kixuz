<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Inicio y Muro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.92);
            --borde: rgba(108, 60, 224, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            position: relative;
            z-index: 900;
            background: rgba(21, 10, 36, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: nowrap;
        }
        @media (max-width: 980px) {
            header { flex-wrap: wrap; }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--texto);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(108, 60, 224, 0.28);
            color: var(--acento);
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #activeCharSelect {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background: rgba(15, 8, 28, 0.9);
            color: var(--texto);
            font-size: 13px;
        }
        main {
            max-width: 980px;
            margin: 24px auto;
            padding: 0 16px 75px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
        }
        .btn {
            background: var(--acento);
            color: #150A24;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary {
            background: rgba(108, 60, 224, 0.28);
            color: var(--texto);
            border: 1px solid var(--borde);
        }
        .btn-danger {
            background: rgba(224, 60, 108, 0.2);
            color: #ff9bb4;
            border: 1px solid rgba(224, 60, 108, 0.5);
        }
        .tag-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(45, 212, 196, 0.16);
            color: var(--acento);
            border: 1px solid rgba(45, 212, 196, 0.4);
            text-decoration: none;
        }
        .muted { opacity: 0.75; font-size: 13px; }
        .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.3);
            color: var(--texto);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        textarea { resize: vertical; }
        .post-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .post-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: 15px;
        }
        .comment-box {
            background: rgba(21, 10, 36, 0.65);
            border: 1px solid rgba(108, 60, 224, 0.28);
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 13.5px;
        }
        .tab-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(21, 10, 36, 0.65);
            color: var(--texto);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--acento);
            color: #150A24;
            border-color: var(--acento);
        }
</style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="display:inline-flex; align-items:center; text-decoration:none;">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height:36px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            <span style="display:none; color:var(--acento); font-weight:800; font-family:'Unbounded',sans-serif;">KIXUZ</span>
        </a>
        <nav class="nav-links">
            <a href="index.html" class="active">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
            <a href="cuenta-maestra.html">Cuenta Maestra</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html" class="btn-auth-link" title="Entrar / Registro" aria-label="Entrar / Registro" style="text-decoration:none;">🔑</a>
        </div>
    </header>
    <main>
        <section class="card">
            <div class="row-between" style="margin-bottom:10px;">
                <div>
                    <h1 style="margin:0; font-family:'Space Grotesk',sans-serif; font-size:22px;">Muro Multiverso KIXUZ</h1>
                    <div id="postingAsLabel" class="muted" style="margin-top:3px;">Publicando con personaje activo</div>
                </div>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <label id="pin72hWrap" style="display:none; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--acento); cursor:pointer;">
                        <input type="checkbox" id="pin72hCheckbox" style="width:auto;">
                        <span>📌 Fijar 72h en Inicio (Aviso Kixuz)</span>
                    </label>
                    <select id="postAlcanceTipo" style="width:auto; padding:7px 10px; font-size:13px;">
                        <option value="general">🌐 Inicio y Muro</option>
                        <option value="universo">🌌 Solo Universo</option>
                        <option value="familia">🏰 Solo Familia / Clan</option>
                    </select>
                    <select id="postAlcanceDestino" style="display:none; width:auto; padding:7px 10px; font-size:13px;"></select>
                </div>
            </div>
            <form id="postForm">
                <textarea id="postContentInput" rows="3" placeholder="Escribí una escena, publicación o novedad... (Shift + Enter: salto de línea)" required></textarea>
                <div class="row-between" style="margin-top:10px;">
                    <span class="muted">Shift + Enter agrega salto de línea sin enviar.</span>
                    <button type="submit" class="btn">Publicar</button>
                </div>
            </form>
        </section>
        <section class="card" style="padding:12px 18px;">
            <div class="row-between">
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" class="tab-btn active" data-sort="recientes">🕒 Más recientes</button>
                    <button type="button" class="tab-btn" data-sort="kixiz">🔥 Más Kixiz</button>
                </div>
                <select id="filterUniverseSelect" style="max-width:240px; padding:7px 10px; font-size:13px;">
                    <option value="">Todos los universos</option>
                </select>
            </div>
        </section>
        <section id="feedPosts" style="display:flex; flex-direction:column; gap:14px;"></section>
    </main>
    <script type="module" src="firebase-config.js"></script>
    <script src="characters.js"></script>
    <script src="theme.js"></script>
    <script src="kixuz-72h-aviso.js"></script>
    <script src="kixuz-admin-master.js"></script>
    <script src="chat.js"></script>

    <script>
        (() => {
            const POSTS_KEY = 'kixuz_posts_v1';
            const PIN_72H_MS = 72 * 60 * 60 * 1000;
            const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const norm = v => String(v || '').trim().toLowerCase();
            const normHandle = v => {
                const s = norm(v).replace(/^@+/, '').replace(/\s+/g, '_');
                return s ? '@' + s : '';
            };

            let postsCache = [];
            let ordenActual = 'recientes';

            function esKixuz() {
                if (window.KIXUZ_DB?.esAdmin) return true;
                const p = window.KIXUZ_DB?.perfilCuenta || {};
                const u = window.KIXUZ_DB?.usuarioActual || {};
                let loc = {};
                try { loc = JSON.parse(localStorage.getItem('kixuz_usuario_local') || '{}') || {}; } catch {}
                const n = norm(p.nombreMaestro || u.displayName || loc.nombreMaestro || loc.nombre || '');
                const e = norm(p.email || u.email || loc.email || '');
                return p.rolSistema === 'admin' || loc.rolSistema === 'admin' || n === 'kixuz' || e.startsWith('kixuz@');
            }

            function getAutor() {
                const ac = window.KIXUZ_ACTIVE_CHAR;
                if (ac && ac.nombre) {
                    return {
                        nombre: String(ac.nombre).trim(),
                        handle: normHandle(ac.handle) || normHandle(ac.nombre) || '@rol',
                        uid: window.KIXUZ_DB?.usuarioActual?.uid || window.KIXUZ_DB?.perfilCuenta?.uid || ''
                    };
                }
                if (esKixuz()) {
                    return { nombre: 'Kixuz', handle: '@Kixuz', uid: window.KIXUZ_DB?.usuarioActual?.uid || '' };
                }
                return { nombre: 'Invitado', handle: '@invitado', uid: '' };
            }

            function puedeBorrar(uid = '', handle = '') {
                if (esKixuz()) return true;
                if (window.KIXUZ_DB?.puedeEliminar) return window.KIXUZ_DB.puedeEliminar(uid, handle);
                const a = getAutor();
                return Boolean(handle && normHandle(handle) === normHandle(a.handle));
            }

            function obtenerUniversosDePersonaje(handle) {
                const h = normHandle(handle);
                const set = new Set();
                try {
                    const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                    subs.forEach(p => {
                        if (normHandle(p.handle) === h) {
                            const arr = Array.isArray(p.universos) ? p.universos : (p.universo ? [p.universo] : []);
                            arr.forEach(u => set.add(norm(u).replace(/^#+/, '')));
                        }
                    });
                    const unis = JSON.parse(localStorage.getItem('kixuz_universos_v1') || '[]');
                    unis.forEach(u => {
                        const miembros = Array.isArray(u.miembros) ? u.miembros.map(normHandle) : [];
                        if (miembros.includes(h) || normHandle(u.creadoPorHandle) === h) {
                            set.add(norm(u.tag || u.nombre).replace(/^#+/, ''));
                        }
                    });
                } catch {}
                return set;
            }

            function obtenerFamiliasYClanesDePersonaje(handle) {
                const h = normHandle(handle);
                const set = new Set();
                try {
                    const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                    subs.forEach(p => {
                        if (normHandle(p.handle) === h && p.clan) set.add(norm(p.clan));
                    });
                    const vincs = JSON.parse(localStorage.getItem('kixuz_vinculos_familia_v1') || '[]');
                    vincs.forEach(v => {
                        if (v.estado === 'aceptada' && (normHandle(v.deHandle) === h || normHandle(v.paraHandle) === h)) {
                            if (v.grupoNombre) set.add(norm(v.grupoNombre));
                            set.add(normHandle(v.deHandle));
                            set.add(normHandle(v.paraHandle));
                        }
                    });
                } catch {}
                return set;
            }

            function puedeVerPost(p) {
                if (esKixuz()) return true;
                const tipo = norm(p.alcanceTipo || 'general');
                if (tipo === 'general' || !tipo) return true;
                const autor = getAutor();
                if (normHandle(p.autorHandle) === normHandle(autor.handle)) return true;

                const destino = norm(p.alcanceDestino || p.universo || '').replace(/^#+/, '');
                if (!destino) return true;

                if (tipo === 'universo') {
                    return obtenerUniversosDePersonaje(autor.handle).has(destino);
                }
                if (tipo === 'familia') {
                    return obtenerFamiliasYClanesDePersonaje(autor.handle).has(destino);
                }
                return true;
            }

            function leerPosts() {
                try {
                    const arr = JSON.parse(localStorage.getItem(POSTS_KEY) || '[]');
                    return Array.isArray(arr) ? arr : [];
                } catch { return []; }
            }

            function guardarPosts(arr) {
                try { localStorage.setItem(POSTS_KEY, JSON.stringify(arr.slice(0, 150))); } catch {}
            }

            function poblarSelectoresUniversoYFamilia() {
                const autor = getAutor();
                const selDestino = document.getElementById('postAlcanceDestino');
                const selFiltroUni = document.getElementById('filterUniverseSelect');
                const tipo = document.getElementById('postAlcanceTipo').value;

                const unisSet = new Set();
                if (esKixuz()) unisSet.add('#Kixuz');
                try {
                    const unis = JSON.parse(localStorage.getItem('kixuz_universos_v1') || '[]');
                    unis.forEach(u => {
                        const t = String(u.tag || u.nombre || '').trim();
                        if (t) unisSet.add(t.startsWith('#') ? t : '#' + t);
                    });
                } catch {}
                postsCache.forEach(p => {
                    if (p.universo && norm(p.universo) !== '#kixuz') unisSet.add(p.universo);
                });

                if (selFiltroUni) {
                    const prev = selFiltroUni.value;
                    selFiltroUni.innerHTML = '<option value="">Todos los universos</option>';
                    Array.from(unisSet).forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u;
                        opt.textContent = u;
                        selFiltroUni.appendChild(opt);
                    });
                    selFiltroUni.value = prev;
                }

                if (selDestino) {
                    if (tipo === 'general') {
                        selDestino.style.display = 'none';
                        selDestino.innerHTML = '';
                    } else if (tipo === 'universo') {
                        selDestino.style.display = 'inline-block';
                        selDestino.innerHTML = '';
                        const misUnis = esKixuz() ? Array.from(unisSet) : Array.from(obtenerUniversosDePersonaje(autor.handle)).map(u => '#' + u);
                        if (!misUnis.length) {
                            selDestino.innerHTML = '<option value="">Unite a un universo primero</option>';
                        } else {
                            misUnis.forEach(u => {
                                if (!esKixuz() && norm(u) === '#kixuz') return;
                                const opt = document.createElement('option');
                                opt.value = u;
                                opt.textContent = u;
                                selDestino.appendChild(opt);
                            });
                        }
                    } else if (tipo === 'familia') {
                        selDestino.style.display = 'inline-block';
                        selDestino.innerHTML = '';
                        const famSet = new Set();
                        if (window.KIXUZ_ACTIVE_CHAR?.clan) famSet.add(window.KIXUZ_ACTIVE_CHAR.clan);
                        try {
                            const vincs = JSON.parse(localStorage.getItem('kixuz_vinculos_familia_v1') || '[]');
                            vincs.forEach(v => {
                                if (v.estado === 'aceptada' && (normHandle(v.deHandle) === normHandle(autor.handle) || normHandle(v.paraHandle) === normHandle(autor.handle))) {
                                    if (v.grupoNombre) famSet.add(v.grupoNombre);
                                }
                            });
                        } catch {}
                        if (!famSet.size) {
                            selDestino.innerHTML = '<option value="">Sin familia/clan vinculado aún</option>';
                        } else {
                            Array.from(famSet).forEach(f => {
                                const opt = document.createElement('option');
                                opt.value = f;
                                opt.textContent = f;
                                selDestino.appendChild(opt);
                            });
                        }
                    }
                }
            }

            function actualizarUI() {
                const autor = getAutor();
                document.getElementById('postingAsLabel').textContent = `Publicando como: ${autor.nombre} (${autor.handle})`;
                document.getElementById('pin72hWrap').style.display = esKixuz() ? 'inline-flex' : 'none';
                poblarSelectoresUniversoYFamilia();
            }

            function renderFeed() {
                const feed = document.getElementById('feedPosts');
                if (!feed) return;
                const filtroUni = norm((document.getElementById('filterUniverseSelect')?.value || '').replace(/^#+/, ''));
                const ahora = Date.now();

                let visibles = postsCache.filter(p => {
                    if (!puedeVerPost(p)) return false;
                    if (p.esAviso72h) {
                        const inicio = Number(p.pinInicioMs || 0);
                        const vigente = !p.desfijadoManual && inicio > 0 && (ahora - inicio) < PIN_72H_MS;
                        if (!vigente) return false;
                    }
                    if (filtroUni) {
                        const uPost = norm((p.universo || p.alcanceDestino || '').replace(/^#+/, ''));
                        if (uPost !== filtroUni) return false;
                    }
                    return true;
                });

                const fijados = visibles.filter(p => p.esAviso72h).sort((a, b) => Number(b.pinInicioMs || 0) - Number(a.pinInicioMs || 0));
                const normales = visibles.filter(p => !p.esAviso72h);

                if (ordenActual === 'kixiz') {
                    normales.sort((a, b) => Number(b.kixiz || 0) - Number(a.kixiz || 0));
                }

                const finalLista = [...fijados, ...normales];

                if (!finalLista.length) {
                    feed.innerHTML = `<div class="card muted" style="text-align:center;">No hay publicaciones visibles con este filtro.</div>`;
                    return;
                }

                feed.innerHTML = '';
                finalLista.forEach(p => {
                    const art = document.createElement('article');
                    art.className = 'post-card';
                    if (p.esAviso72h) art.style.borderColor = 'var(--acento)';

                    const delPost = puedeBorrar(p.autorUid, p.autorHandle);
                    const respuestas = Array.isArray(p.respuestas) ? p.respuestas : [];
                    const hLink = encodeURIComponent(p.autorHandle || p.autorNombre || '');

                    let alcanceBadge = '';
                    if (p.esAviso72h) {
                        alcanceBadge = `<span class="tag-pill">📌 Aviso Oficial Kixuz (72h)</span>`;
                    } else if (p.alcanceTipo === 'universo' && p.alcanceDestino) {
                        alcanceBadge = `<a href="universo.html" class="tag-pill">🌌 ${esc(p.alcanceDestino)}</a>`;
                    } else if (p.alcanceTipo === 'familia' && p.alcanceDestino) {
                        alcanceBadge = `<a href="familia.html" class="tag-pill">🏰 ${esc(p.alcanceDestino)}</a>`;
                    } else if (p.universo) {
                        alcanceBadge = `<a href="universo.html" class="tag-pill">${esc(p.universo)}</a>`;
                    }

                    art.innerHTML = `
                        <div class="row-between">
                            <div>
                                <a href="perfil.html?char=${hLink}" style="color:var(--acento); font-weight:700; text-decoration:none;">${esc(p.autorNombre || 'Personaje')}</a>
                                <span class="muted">${esc(p.autorHandle || '')}</span>
                            </div>
                            <div style="display:flex; gap:6px; align-items:center;">
                                ${alcanceBadge}
                                ${delPost ? `<button type="button" class="btn btn-danger btn-del-post" style="padding:4px 9px; font-size:12px;">🗑️</button>` : ''}
                            </div>
                        </div>
                        <div class="post-content">${esc(p.contenido || '')}</div>
                        <div class="row-between">
                            <button type="button" class="btn btn-secondary btn-kix" style="padding:6px 12px; font-size:12.5px;">🔥 Kix (${Number(p.kixiz || 0)})</button>
                            <span class="muted">${respuestas.length} comentario(s)</span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:7px;">
                            ${respuestas.map((r, idx) => {
                                const delR = puedeBorrar(r.autorUid, r.autorHandle);
                                const rLink = encodeURIComponent(r.autorHandle || r.autorNombre || '');
                                return `
                                    <div class="comment-box">
                                        <div class="row-between" style="margin-bottom:3px;">
                                            <a href="perfil.html?char=${rLink}" style="font-size:12.5px; font-weight:700; color:var(--acento); text-decoration:none;">${esc(r.autorNombre || 'Personaje')} <span class="muted">${esc(r.autorHandle || '')}</span></a>
                                            ${delR ? `<button type="button" class="btn btn-danger btn-del-reply" data-idx="${idx}" style="padding:2px 7px; font-size:11px;">Borrar</button>` : ''}
                                        </div>
                                        <div style="white-space:pre-wrap; word-break:break-word;">${esc(r.texto || '')}</div>
                                    </div>
                                `;
                            }).join('')}
                            <form class="reply-form" style="display:flex; gap:8px; align-items:flex-end; margin-top:4px;">
                                <textarea class="reply-input" rows="1" placeholder="Comentar... (Shift + Enter: salto de línea)" style="flex:1; min-height:38px;"></textarea>
                                <button type="submit" class="btn btn-secondary" style="padding:8px 12px;">Enviar</button>
                            </form>
                        </div>
                    `;

                    art.querySelector('.btn-kix').addEventListener('click', async () => {
                        p.kixiz = Number(p.kixiz || 0) + 1;
                        guardarPosts(postsCache);
                        renderFeed();
                        if (window.KIXUZ_DB?.darKix) {
                            try { await window.KIXUZ_DB.darKix(p.id, 1); } catch {}
                        }
                    });

                    const delBtn = art.querySelector('.btn-del-post');
                    if (delBtn) {
                        delBtn.addEventListener('click', async () => {
                            if (!puedeBorrar(p.autorUid, p.autorHandle)) return;
                            postsCache = postsCache.filter(x => String(x.id) !== String(p.id));
                            guardarPosts(postsCache);
                            renderFeed();
                            if (window.KIXUZ_DB?.eliminarPost) {
                                try { await window.KIXUZ_DB.eliminarPost(p.id); } catch {}
                            }
                        });
                    }

                    art.querySelectorAll('.btn-del-reply').forEach(b => {
                        b.addEventListener('click', async () => {
                            const i = Number(b.dataset.idx);
                            const arr = Array.isArray(p.respuestas) ? [...p.respuestas] : [];
                            if (i < 0 || i >= arr.length) return;
                            if (!puedeBorrar(arr[i].autorUid, arr[i].autorHandle)) return;
                            arr.splice(i, 1);
                            p.respuestas = arr;
                            guardarPosts(postsCache);
                            renderFeed();
                            if (window.KIXUZ_DB?.actualizarRespuestasPost) {
                                try { await window.KIXUZ_DB.actualizarRespuestasPost(p.id, arr); } catch {}
                            }
                        });
                    });

                    const rForm = art.querySelector('.reply-form');
                    const rInp = art.querySelector('.reply-input');
                    rInp.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            rForm.requestSubmit();
                        }
                    });
                    rForm.addEventListener('submit', async ev => {
                        ev.preventDefault();
                        const txt = String(rInp.value || '').replace(/^\n+|\n+$/g, '');
                        if (!txt.trim()) return;
                        const autor = getAutor();
                        const rep = { autorNombre: autor.nombre, autorHandle: autor.handle, autorUid: autor.uid, texto: txt };
                        p.respuestas = Array.isArray(p.respuestas) ? [...p.respuestas, rep] : [rep];
                        rInp.value = '';
                        guardarPosts(postsCache);
                        renderFeed();
                        if (window.KIXUZ_DB?.agregarRespuestaPost) {
                            try { await window.KIXUZ_DB.agregarRespuestaPost(p.id, rep); } catch {}
                        }
                    });

                    feed.appendChild(art);
                });
            }

            document.getElementById('postAlcanceTipo').addEventListener('change', poblarSelectoresUniversoYFamilia);

            const ta = document.getElementById('postContentInput');
            ta.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('postForm').requestSubmit();
                }
            });

            document.getElementById('postForm').addEventListener('submit', async e => {
                e.preventDefault();
                const contenido = String(ta.value || '').replace(/^\n+|\n+$/g, '');
                if (!contenido.trim()) return;

                const autor = getAutor();
                const pin72h = Boolean(document.getElementById('pin72hCheckbox')?.checked && esKixuz());
                const alcanceTipo = pin72h ? 'general' : document.getElementById('postAlcanceTipo').value;
                const alcanceDestino = pin72h ? '#Kixuz' : (document.getElementById('postAlcanceDestino').value || '');

                if (alcanceTipo !== 'general' && !alcanceDestino) {
                    alert('Elegí un Universo o Familia/Clan válido para publicar en ese grupo.');
                    return;
                }

                if (pin72h) {
                    postsCache.forEach(item => {
                        if (item.esAviso72h) item.desfijadoManual = true;
                    });
                }

                const nuevo = {
                    id: 'local_' + Date.now(),
                    autorNombre: pin72h ? 'Kixuz' : autor.nombre,
                    autorHandle: pin72h ? '@Kixuz' : autor.handle,
                    autorUid: autor.uid,
                    muroHandle: pin72h ? '@Kixuz' : autor.handle,
                    contenido,
                    universo: pin72h ? '#Kixuz' : (alcanceTipo === 'universo' ? alcanceDestino : ''),
                    alcanceTipo,
                    alcanceDestino,
                    esAviso72h: pin72h,
                    pinInicioMs: pin72h ? Date.now() : 0,
                    desfijadoManual: false,
                    kixiz: 0,
                    respuestas: []
                };

                postsCache = [nuevo, ...postsCache];
                guardarPosts(postsCache);
                ta.value = '';
                if (document.getElementById('pin72hCheckbox')) document.getElementById('pin72hCheckbox').checked = false;
                poblarSelectoresUniversoYFamilia();
                renderFeed();

                if (window.KIXUZ_DB?.publicarPost) {
                    try {
                        const resId = await window.KIXUZ_DB.publicarPost({
                            contenido,
                            universo: nuevo.universo,
                            esAviso72h: pin72h,
                            alcanceTipo,
                            alcanceDestino,
                            autorNombre: nuevo.autorNombre,
                            autorHandle: nuevo.autorHandle
                        });
                        if (typeof resId === 'string' && resId) {
                            nuevo.id = resId;
                            guardarPosts(postsCache);
                        }
                    } catch {}
                }
            });

            document.querySelectorAll('[data-sort]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    ordenActual = btn.dataset.sort;
                    renderFeed();
                });
            });

            document.getElementById('filterUniverseSelect').addEventListener('change', renderFeed);

            window.addEventListener('DOMContentLoaded', () => {
                postsCache = leerPosts();
                actualizarUI();
                renderFeed();
            });
            window.addEventListener('kixuz:personajes-actualizados', () => { actualizarUI(); renderFeed(); });
            window.addEventListener('kixuz:sesion-actualizada', () => { actualizarUI(); renderFeed(); });
            window.addEventListener('load', () => {
                actualizarUI();
                if (window.KIXUZ_DB?.activo && window.KIXUZ_DB?.escucharPosts) {
                    window.KIXUZ_DB.escucharPosts(nube => {
                        if (!Array.isArray(nube)) return;
                        const loc = leerPosts().filter(p => String(p.id || '').startsWith('local_'));
                        const m = new Map();
                        nube.forEach(p => m.set(String(p.id), p));
                        loc.forEach(p => { if (!m.has(String(p.id))) m.set(String(p.id), p); });
                        postsCache = Array.from(m.values());
                        guardarPosts(postsCache);
                        poblarSelectoresUniversoYFamilia();
                        renderFeed();
                    });
                }
            });
        })();
    </script>

</body>
</html>
