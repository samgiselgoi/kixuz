<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <title>KIXUZ — Muro Principal</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #150A24;
      --card: #1F1135;
      --card-2: #281644;
      --border: rgba(108, 60, 224, 0.35);
      --primary: #6C3CE0;
      --accent: #2DD4C4;
      --texto: #EDE7E0;
      --muted: rgba(237, 231, 224, 0.65);
    }
    html[data-theme="light"] {
      --bg: #F5F2FA;
      --card: #FFFFFF;
      --card-2: #EFE9FA;
      --border: rgba(108, 60, 224, 0.25);
      --texto: #150A24;
      --muted: rgba(21, 10, 36, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(21, 10, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 26px;
    }
    html[data-theme="light"] header {
      background: rgba(255, 255, 255, 0.92);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6C3CE0, #2DD4C4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #150A24;
      font-weight: 800;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .char-select {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .container {
      max-width: 1040px;
      margin: 26px auto;
      padding: 0 18px 60px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #EDE7E0;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-accent { background: var(--accent); color: #150A24; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--texto);
    }
    .input, .textarea, .select {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(108, 60, 224, 0.24);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C3CE0, #2DD4C4);
      color: #150A24;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .post-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .action-chip {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--texto);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-chip.liked {
      border-color: var(--accent);
      color: var(--accent);
    }
    .comments-box {
      margin-top: 10px;
      padding-left: 12px;
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .comment-item {
      font-size: 13px;
      background: var(--card-2);
      padding: 7px 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand" aria-label="KIXUZ Inicio">
      <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 34px;">
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="index.html" title="Inicio">Inicio</a>
      <a href="perfil.html" title="Mi Personaje">Mi Personaje</a>
      <a href="universo.html">Universos</a>
      <a href="familia.html">Familia / Clan</a>
    </nav>
    <div class="user-menu">
      <select id="activeCharSelect" class="char-select" aria-label="Personaje activo">
        <option value="@theo">Theo Kwon (@theo)</option>
        <option value="@cypher">Cypher (@cypher)</option>
        <option value="@elara_vance">Elara Vance (@elara_vance)</option>
        <option value="@liam_miller">Liam Miller (@liam_miller)</option>
      </select>
      <a href="registro.html" class="btn btn-accent">Entrar</a>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Nueva escena en el muro</h2>
        <span id="postingAsBadge" class="badge">Publicando como Theo Kwon (@theo)</span>
      </div>
      <textarea id="postContent" class="textarea" rows="3" placeholder="Escribe una acción, diálogo o crónica... Usa #Universo para etiquetar"></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;flex-wrap:wrap;">
        <select id="postUniverse" class="select" style="max-width:220px;">
          <option value="#NexoCentral">#NexoCentral</option>
          <option value="#Sector4">#Sector4</option>
          <option value="#Aethelgard">#Aethelgard</option>
        </select>
        <button id="publishBtn" type="button" class="btn btn-accent">Publicar escena</button>
      </div>
    </section>

    <section id="feedContainer"></section>
  </main>

  <script>
    const defaultPosts = [
      {
        id: 'p1',
        author: 'Cypher',
        handle: '@cypher',
        universe: '#Sector4',
        time: 'Hace 12 min',
        text: 'Las luces de neón del Sector 4 parpadean mientras reviso las coordenadas encriptadas en la terminal.',
        kix: 7,
        liked: false,
        comments: [{ author: '@elara_vance', text: 'Voy en camino al punto de encuentro.' }]
      },
      {
        id: 'p2',
        author: 'Theo Kwon',
        handle: '@theo',
        universe: '#NexoCentral',
        time: 'Hace 38 min',
        text: 'El consejo de la Orden del Eclipse se reúne esta noche. Nadie entra sin contraseña.',
        kix: 12,
        liked: false,
        comments: []
      }
    ];

    function getPosts() {
      try {
        const saved = JSON.parse(localStorage.getItem('kixuz_posts') || 'null');
        return Array.isArray(saved) && saved.length ? saved : defaultPosts;
      } catch(e) { return defaultPosts; }
    }

    function savePosts(posts) {
      localStorage.setItem('kixuz_posts', JSON.stringify(posts));
    }

    function renderFeed() {
      const feed = document.getElementById('feedContainer');
      const posts = getPosts();
      feed.innerHTML = posts.map(p => `
        <article class="post-card">
          <div class="post-header">
            <div class="post-author">
              <div class="avatar-circle">${p.author.charAt(0).toUpperCase()}</div>
              <div>
                <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;">${p.author} <a href="perfil.html?char=${encodeURIComponent(p.handle)}" style="color:var(--accent);text-decoration:none;font-size:13px;">${p.handle}</a></div>
                <div style="font-size:12px;color:var(--muted);">${p.time}</div>
              </div>
            </div>
            <a href="universo.html?u=${encodeURIComponent(p.universe.replace('#',''))}" class="badge" style="text-decoration:none;">${p.universe}</a>
          </div>
          <p style="line-height:1.55;font-size:14.5px;white-space:pre-line;">${p.text}</p>
          <div class="post-actions">
            <button type="button" class="action-chip ${p.liked ? 'liked' : ''}" onclick="toggleKix('${p.id}')">🔥 Kix (${p.kix})</button>
            <button type="button" class="action-chip" onclick="promptComment('${p.id}')">💬 Comentar (${p.comments.length})</button>
          </div>
          ${p.comments.length ? `<div class="comments-box">${p.comments.map(c => `<div class="comment-item"><strong style="color:var(--accent);">${c.author}:</strong> ${c.text}</div>`).join('')}</div>` : ''}
        </article>
      `).join('');
    }

    window.toggleKix = function(id) {
      const posts = getPosts();
      const post = posts.find(x => x.id === id);
      if (!post) return;
      post.liked = !post.liked;
      post.kix += post.liked ? 1 : -1;
      savePosts(posts);
      renderFeed();
    };

    window.promptComment = function(id) {
      const txt = prompt('Escribe tu respuesta en rol:');
      if (!txt || !txt.trim()) return;
      const sel = document.getElementById('activeCharSelect');
      const handle = sel ? sel.value : '@theo';
      const posts = getPosts();
      const post = posts.find(x => x.id === id);
      if (!post) return;
      post.comments.push({ author: handle, text: txt.trim() });
      savePosts(posts);
      renderFeed();
    };

    document.getElementById('publishBtn').addEventListener('click', () => {
      const content = document.getElementById('postContent').value.trim();
      if (!content) return;
      const sel = document.getElementById('activeCharSelect');
      const opt = sel.options[sel.selectedIndex];
      const author = opt ? opt.textContent.split(' (')[0] : 'Theo Kwon';
      const handle = sel.value;
      const universe = document.getElementById('postUniverse').value;
      const posts = getPosts();
      posts.unshift({
        id: 'p_' + Date.now(),
        author,
        handle,
        universe,
        time: 'Ahora mismo',
        text: content,
        kix: 0,
        liked: false,
        comments: []
      });
      savePosts(posts);
      document.getElementById('postContent').value = '';
      renderFeed();
    });

    renderFeed();
  </script>
  <script>
    (function() {
      const sel = document.getElementById('activeCharSelect');
      if (!sel) return;
      try {
        const extra = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
        extra.forEach(p => {
          if (p && p.handle && !Array.from(sel.options).some(o => o.value === p.handle)) {
            const opt = document.createElement('option');
            opt.value = p.handle;
            opt.textContent = `${p.nombre} (${p.handle})`;
            sel.appendChild(opt);
          }
        });
      } catch(e) {}
      const saved = localStorage.getItem('kixuz_active_char');
      if (saved && Array.from(sel.options).some(o => o.value === saved)) {
        sel.value = saved;
      }
      function syncBadge() {
        const badge = document.getElementById('postingAsBadge');
        if (badge) {
          const opt = sel.options[sel.selectedIndex];
          badge.textContent = `Publicando como ${opt ? opt.textContent : sel.value}`;
        }
      }
      syncBadge();
      sel.addEventListener('change', () => {
        localStorage.setItem('kixuz_active_char', sel.value);
        syncBadge();
        window.dispatchEvent(new CustomEvent('kixuz:charChanged', { detail: sel.value }));
      });
    })();
  </script>
  <script src="theme.js"></script>
  <script src="buscador-global.js"></script>
  <script src="navbar-ui.js"></script>
  <script src="notificaciones.js"></script>
  <script src="chat.js"></script>
  <script src="characters.js"></script>
</body>
</html>
