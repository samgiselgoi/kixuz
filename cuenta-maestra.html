<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Mi Cuenta Maestra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.9);
            --borde: rgba(108, 60, 224, 0.38);
        }
        html[data-theme="light"] {
            --bg-principal: #F4F1FA;
            --bg-secundario: #6C3CE0;
            --acento: #0F9D8E;
            --texto: #150A24;
            --tarjeta: rgba(255, 255, 255, 0.94);
            --borde: rgba(108, 60, 224, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
            min-height: 100vh;
            line-height: 1.5;
        }
        header {
            background: rgba(21, 10, 36, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
        }
        html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
        .nav-links a {
            color: var(--texto); text-decoration: none; padding: 6px 10px;
            border-radius: 8px; font-size: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
        }
        .user-menu { display: flex; align-items: center; gap: 8px; }
        .user-menu select {
            background: rgba(0, 0, 0, 0.35); color: var(--texto);
            border: 1px solid var(--borde); border-radius: 8px; padding: 6px 10px; font-size: 13px;
        }
        .btn-auth-link {
            background: var(--acento); color: #150A24 !important;
            padding: 6px 12px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif;
            font-size: 13px; font-weight: 700; text-decoration: none;
        }
        main {
            max-width: 1020px;
            margin: 28px auto 90px;
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
        }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; color: var(--acento); }
        .row-between {
            display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .btn {
            background: var(--acento); color: #150A24; border: none; border-radius: 10px;
            padding: 9px 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
            font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-ghost {
            background: rgba(108, 60, 224, 0.22); color: var(--texto);
            border: 1px solid var(--borde); border-radius: 8px; padding: 6px 11px;
            font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px;
            cursor: pointer; text-decoration: none;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }
        .profile-item-card {
            background: rgba(21, 10, 36, 0.75);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        html[data-theme="light"] .profile-item-card { background: #F8F5FC; }
        .pill {
            display: inline-block; width: fit-content; font-size: 11px; font-weight: 700;
            padding: 2px 9px; border-radius: 999px;
            background: rgba(45, 212, 196, 0.16); color: var(--acento);
            border: 1px solid rgba(45, 212, 196, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 36px;">
        </a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
            <a href="crear-personaje.html">+ Personaje</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html" class="btn-auth-link">Entrar / Registro</a>
        </div>
    </header>

    <main>
        <section class="panel">
            <div class="row-between">
                <div>
                    <h1 style="font-size:22px;">Mi Cuenta Maestra</h1>
                    <p style="font-size:13.5px;opacity:0.78;margin-top:4px;">Administrá tus personajes y revisá los perfiles creados en la página.</p>
                </div>
                <a href="crear-personaje.html" class="btn">+ Crear personaje</a>
            </div>
        </section>

        <section class="panel" id="masterProfilesPanel">
            <div class="row-between">
                <h2 style="font-size:18px;">Perfiles creados en la página</h2>
                <span class="pill">Solo Cuenta Maestra</span>
            </div>
            <div id="masterProfilesGrid" class="cards-grid"></div>
        </section>
    </main>

    <script>
        (() => {
            const esc = s => String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

            const normH = v => {
                const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
                return s ? '@' + s : '';
            };

            function tieneAccesoCuentaMaestra() {
                if (window.KIXUZ_DB?.activo && window.KIXUZ_DB?.usuarioActual) return true;
                try {
                    const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                    if (Array.isArray(subs) && subs.length > 0) return true;
                    const act = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
                    if (act && act.handle) return true;
                } catch {}
                return false;
            }

            async function cargarPerfilesCreados() {
                const grid = document.getElementById('masterProfilesGrid');
                if (!grid) return;

                if (!tieneAccesoCuentaMaestra()) {
                    grid.innerHTML = `<div style="grid-column:1/-1;font-size:13.5px;opacity:0.78;">Iniciá sesión en tu Cuenta Maestra o creá un personaje para ver los perfiles creados.</div>`;
                    return;
                }

                let activoHandle = '';
                try {
                    const act = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
                    activoHandle = normH(act?.handle);
                } catch {}

                const mapa = new Map();
                const addPerfil = (p, origen = 'Creado') => {
                    if (!p) return;
                    const h = normH(p.handle || p.autorHandle || '');
                    const nom = String(p.nombre || p.autorNombre || '').trim() || (h ? h.slice(1) : '');
                    if (!h && !nom) return;
                    const key = h || nom.toLowerCase();
                    const prev = mapa.get(key) || {};
                    mapa.set(key, {
                        nombre: nom || prev.nombre,
                        handle: h || prev.handle,
                        clan: p.clan || prev.clan || '',
                        esActivo: activoHandle && key === activoHandle,
                        origen: prev.origen === 'Subpersonaje' ? 'Subpersonaje' : origen
                    });
                };

                try {
                    const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                    if (Array.isArray(subs)) subs.forEach(p => addPerfil(p, 'Subpersonaje'));
                } catch {}

                if (window.KIXUZ_DB?.listarPersonajesPublicos) {
                    try {
                        const pub = await window.KIXUZ_DB.listarPersonajesPublicos();
                        (pub || []).forEach(p => addPerfil(p, 'Página'));
                    } catch {}
                }

                const lista = Array.from(mapa.values());
                if (!lista.length) {
                    grid.innerHTML = `<div style="grid-column:1/-1;font-size:13.5px;opacity:0.75;">Todavía no hay perfiles creados en la página.</div>`;
                    return;
                }

                grid.innerHTML = lista.map(p => `
                    <article class="profile-item-card">
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                            <span class="pill">${esc(p.origen)}</span>
                            ${p.esActivo ? `<span class="pill">Activo</span>` : ''}
                        </div>
                        <strong style="font-family:'Space Grotesk',sans-serif;font-size:15.5px;color:var(--acento);">${esc(p.nombre)}</strong>
                        <div style="font-size:12.5px;opacity:0.82;">${esc(p.handle)}${p.clan ? ' · ' + esc(p.clan) : ''}</div>
                        <a href="perfil.html?char=${encodeURIComponent(p.handle)}" class="btn-ghost" style="text-align:center;margin-top:auto;">Ver perfil</a>
                    </article>
                `).join('');
            }

            window.addEventListener('DOMContentLoaded', cargarPerfilesCreados);
            window.addEventListener('kixuz:personajes-actualizados', cargarPerfilesCreados);
            window.addEventListener('kixuz:sesion-actualizada', cargarPerfilesCreados);
        })();
    </script>

    <script src="chat.js"></script>
    <script src="theme.js"></script>
    <script src="characters.js"></script>
    <script src="buscador-global.js"></script>
    <script src="navbar-ui.js"></script>
    <script src="notificaciones.js"></script>
    <script src="amigos.js"></script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
