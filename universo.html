<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universos - KIXUZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(108, 60, 224, 0.14);
            --borde: rgba(108, 60, 224, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-principal);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            line-height: 1.55;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }
        header {
            background: rgba(21, 10, 36, 0.92);
            border-bottom: 1px solid var(--borde);
        }
        .logo {
            font-family: 'Unbounded', cursive;
            font-size: 20px;
            font-weight: 800;
            color: var(--bg-secundario);
            text-decoration: none;
        }
        .logo span { color: var(--acento); }
        .container { max-width: 1040px; margin: 24px auto 80px; padding: 0 16px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .top-bar h1 { font-size: 24px; color: var(--acento); }
        .btn-accent {
            background: var(--acento);
            color: #150A24;
            border: none;
            padding: 9px 15px;
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-ghost {
            background: transparent;
            color: var(--texto);
            border: 1px solid var(--borde);
            padding: 8px 13px;
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
        }
        .panel {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
        }
        .grid-universos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 16px;
        }
        .uni-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .uni-tag {
            color: var(--acento);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
        }
        input, textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: 9px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.35);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            margin-bottom: 10px;
            outline: none;
        }
        html[data-theme="light"] input,
        html[data-theme="light"] textarea { background: #fff; color: #150A24; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
        .tab-btn.active { background: var(--acento); color: #150A24; border-color: var(--acento); }
        .post-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(108, 60, 224, 0.35);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">KI<span>X</span>UZ</a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html" class="active">Universos</a>
            <a href="familia.html">Familia</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html">Entrar</a>
        </div>
    </header>

    <main class="container">
        <div class="top-bar">
            <div>
                <h1>Universos</h1>
                <p style="margin-top:4px;opacity:0.78;font-size:13.5px;">Crea o entra a un universo por su #Etiqueta y publica tramas en su muro.</p>
            </div>
            <button type="button" class="btn-accent" id="btnToggleForm">+ Nuevo Universo</button>
        </div>

        <section class="panel" id="formCrearUniverso" style="display:none;">
            <h3 style="color:var(--acento);margin-bottom:12px;">Crear Universo</h3>
            <input type="text" id="uniNombre" placeholder="Nombre del universo (ej. Ciudad Neón)">
            <input type="text" id="uniTag" placeholder="#Etiqueta (ej. #CiudadNeon)">
            <textarea id="uniDesc" rows="2" placeholder="Descripción breve del mundo..."></textarea>
            <textarea id="uniReglas" rows="2" placeholder="Reglas o ambientación..."></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button type="button" class="btn-ghost" id="btnCancelarUni">Cancelar</button>
                <button type="button" class="btn-accent" id="btnGuardarUni">Crear</button>
            </div>
        </section>

        <section id="vistaDirectorio">
            <div class="grid-universos" id="listaUniversos"></div>
        </section>

        <section id="vistaDetalle" style="display:none;"></section>
    </main>

    <script src="universos-core.js"></script>
    <script src="theme.js"></script>
    <script src="navbar-ui.js"></script>
    <script src="chat.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let universoActualTag = params.get('u') && window.KIXUZ_UNIVERSOS?.normTag
            ? window.KIXUZ_UNIVERSOS.normTag(params.get('u'))
            : '';
        let pestanaActiva = 'muro';

        const normTagFallback = tag => {
            const clean = String(tag || '').trim().replace(/^#+/, '').replace(/\s+/g, '');
            return clean ? '#' + clean : '';
        };

        const getNormTag = tag => window.KIXUZ_UNIVERSOS?.normTag ? window.KIXUZ_UNIVERSOS.normTag(tag) : normTagFallback(tag);

        function getActivo() {
            if (window.KIXUZ_ACTIVE_CHAR?.handle) return window.KIXUZ_ACTIVE_CHAR.handle;
            try {
                const act = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
                if (act?.handle) return act.handle;
            } catch {}
            return '@personaje';
        }

        function leerPosts() {
            try {
                const raw = JSON.parse(localStorage.getItem('kixuz_posts') || '[]');
                return Array.isArray(raw) ? raw : [];
            } catch { return []; }
        }

        function guardarPosts(arr) {
            try { localStorage.setItem('kixuz_posts', JSON.stringify(arr)); } catch {}
        }

        function renderDirectorio() {
            document.getElementById('vistaDetalle').style.display = 'none';
            document.getElementById('vistaDirectorio').style.display = 'block';
            const lista = window.KIXUZ_UNIVERSOS?.leerUniversos ? window.KIXUZ_UNIVERSOS.leerUniversos() : [];
            const box = document.getElementById('listaUniversos');
            if (!lista.length) {
                box.innerHTML = `<div class="panel" style="grid-column:1/-1;text-align:center;opacity:0.8;">Aún no hay universos creados. Usa <strong>+ Nuevo Universo</strong> para crear el primero.</div>`;
                return;
            }
            box.innerHTML = lista.map(u => `
                <article class="uni-card">
                    <div class="uni-tag">${u.tag}</div>
                    <h3>${u.nombre}</h3>
                    <p style="font-size:13px;opacity:0.82;">${u.descripcion || 'Sin descripción.'}</p>
                    <div style="font-size:12px;opacity:0.7;">Miembros: ${(u.miembros || []).length}</div>
                    <button type="button" class="btn-accent" onclick="abrirUniverso('${encodeURIComponent(u.tag)}')">Entrar</button>
                </article>
            `).join('');
        }

        window.abrirUniverso = function(tagEncoded) {
            universoActualTag = getNormTag(decodeURIComponent(tagEncoded));
            pestanaActiva = 'muro';
            renderDetalle();
        };

        function renderDetalle() {
            const lista = window.KIXUZ_UNIVERSOS?.leerUniversos ? window.KIXUZ_UNIVERSOS.leerUniversos() : [];
            const uni = lista.find(u => u.tag.toLowerCase() === universoActualTag.toLowerCase());
            if (!uni) {
                universoActualTag = '';
                renderDirectorio();
                return;
            }

            document.getElementById('vistaDirectorio').style.display = 'none';
            const det = document.getElementById('vistaDetalle');
            det.style.display = 'block';

            const yo = getActivo();
            const esMiembro = (uni.miembros || []).includes(yo);
            const postsUni = leerPosts().filter(p => getNormTag(p.universo || p.universe || '').toLowerCase() === uni.tag.toLowerCase());

            det.innerHTML = `
                <div class="panel">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                        <button type="button" class="btn-ghost" id="btnVolverUni">← Todos los Universos</button>
                        <button type="button" class="btn-accent" id="btnToggleUnirse">${esMiembro ? 'Salir del Universo' : 'Unirme al Universo'}</button>
                    </div>
                    <div class="uni-tag" style="margin-top:12px;">${uni.tag}</div>
                    <h1 style="margin-top:4px;">${uni.nombre}</h1>
                    <p style="opacity:0.85;margin-top:8px;">${uni.descripcion || 'Sin descripción.'}</p>
                </div>

                <div class="tabs">
                    <button type="button" class="btn-ghost tab-btn ${pestanaActiva === 'muro' ? 'active' : ''}" data-tab="muro">Muro</button>
                    <button type="button" class="btn-ghost tab-btn ${pestanaActiva === 'mapas' ? 'active' : ''}" data-tab="mapas">Mapas e Imágenes</button>
                    <button type="button" class="btn-ghost tab-btn ${pestanaActiva === 'info' ? 'active' : ''}" data-tab="info">Miembros y Reglas</button>
                </div>

                <div class="panel" id="contenidoPestanaUni"></div>
            `;

            det.querySelector('#btnVolverUni').addEventListener('click', () => {
                universoActualTag = '';
                renderDirectorio();
            });

            det.querySelector('#btnToggleUnirse').addEventListener('click', () => {
                const todos = window.KIXUZ_UNIVERSOS?.leerUniversos ? window.KIXUZ_UNIVERSOS.leerUniversos() : [];
                const target = todos.find(x => x.tag.toLowerCase() === uni.tag.toLowerCase());
                if (!target) return;
                target.miembros = Array.isArray(target.miembros) ? target.miembros : [];
                if (target.miembros.includes(yo)) {
                    target.miembros = target.miembros.filter(m => m !== yo);
                } else {
                    target.miembros.push(yo);
                }
                window.KIXUZ_UNIVERSOS?.guardarUniversos?.(todos);
                renderDetalle();
            });

            det.querySelectorAll('.tab-btn').forEach(b => {
                b.addEventListener('click', () => {
                    pestanaActiva = b.dataset.tab;
                    renderDetalle();
                });
            });

            const cont = det.querySelector('#contenidoPestanaUni');
            if (pestanaActiva === 'muro') {
                cont.innerHTML = `
                    <textarea id="uniPostTexto" rows="3" placeholder="Publicar en ${uni.tag}..."></textarea>
                    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
                        <button type="button" class="btn-accent" id="btnPublicarUni">Publicar</button>
                    </div>
                    ${postsUni.length ? postsUni.map(p => `
                        <article class="post-card">
                            <strong>${p.autor || yo}</strong> <span class="uni-tag">${uni.tag}</span>
                            <p style="margin-top:8px;white-space:pre-line;">${p.contenido || p.texto || ''}</p>
                        </article>
                    `).join('') : '<p style="opacity:0.7;">Aún no hay publicaciones en este universo.</p>'}
                `;
                cont.querySelector('#btnPublicarUni').addEventListener('click', () => {
                    const txt = cont.querySelector('#uniPostTexto').value.trim();
                    if (!txt) return;
                    const actualPosts = leerPosts();
                    actualPosts.unshift({
                        id: 'post_' + Date.now(),
                        autor: yo,
                        contenido: txt,
                        universo: uni.tag,
                        createdAtMs: Date.now()
                    });
                    guardarPosts(actualPosts);
                    renderDetalle();
                });
            } else if (pestanaActiva === 'mapas') {
                cont.innerHTML = `
                    <input type="text" id="mapaTitulo" placeholder="Título del mapa o escena">
                    <input type="text" id="mapaUrl" placeholder="URL de imagen (https://...)">
                    <button type="button" class="btn-accent" id="btnAgregarMapa">Agregar</button>
                    <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;">
                        ${(uni.mapas || []).map(m => `
                            <div class="post-card">
                                <strong>${m.titulo || 'Mapa'}</strong>
                                ${m.url ? `<img src="${m.url}" alt="${m.titulo || 'Mapa'}" style="width:100%;border-radius:8px;margin-top:8px;">` : ''}
                            </div>
                        `).join('') || '<p style="opacity:0.7;">Sin mapas cargados.</p>'}
                    </div>
                `;
                cont.querySelector('#btnAgregarMapa').addEventListener('click', () => {
                    const titulo = cont.querySelector('#mapaTitulo').value.trim();
                    const url = cont.querySelector('#mapaUrl').value.trim();
                    if (!titulo && !url) return;
                    const todos = window.KIXUZ_UNIVERSOS?.leerUniversos ? window.KIXUZ_UNIVERSOS.leerUniversos() : [];
                    const target = todos.find(x => x.tag.toLowerCase() === uni.tag.toLowerCase());
                    if (target) {
                        target.mapas = Array.isArray(target.mapas) ? target.mapas : [];
                        target.mapas.unshift({ titulo: titulo || 'Escena', url });
                        window.KIXUZ_UNIVERSOS?.guardarUniversos?.(todos);
                        renderDetalle();
                    }
                });
            } else {
                cont.innerHTML = `
                    <h3>Reglas</h3>
                    <p style="opacity:0.85;white-space:pre-line;margin-top:6px;">${uni.reglas || 'Sin reglas definidas.'}</p>
                    <h3 style="margin-top:14px;">Miembros (${(uni.miembros || []).length})</h3>
                    <p style="opacity:0.85;margin-top:6px;">${(uni.miembros || []).join(', ') || 'Ningún miembro unido aún.'}</p>
                `;
            }
        }

        document.getElementById('btnToggleForm').addEventListener('click', () => {
            const sec = document.getElementById('formCrearUniverso');
            sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('btnCancelarUni').addEventListener('click', () => {
            document.getElementById('formCrearUniverso').style.display = 'none';
        });
        document.getElementById('btnGuardarUni').addEventListener('click', () => {
            const nombre = document.getElementById('uniNombre').value.trim();
            const tag = document.getElementById('uniTag').value.trim();
            const descripcion = document.getElementById('uniDesc').value.trim();
            const reglas = document.getElementById('uniReglas').value.trim();
            const creado = window.KIXUZ_UNIVERSOS?.crearUniverso?.({
                nombre,
                tag,
                descripcion,
                reglas,
                creadorHandle: getActivo()
            });
            if (!creado) return;
            document.getElementById('uniNombre').value = '';
            document.getElementById('uniTag').value = '';
            document.getElementById('uniDesc').value = '';
            document.getElementById('uniReglas').value = '';
            document.getElementById('formCrearUniverso').style.display = 'none';
            universoActualTag = creado.tag;
            renderDetalle();
        });

        window.addEventListener('kixuz:universos-actualizados', () => {
            if (universoActualTag) renderDetalle();
            else renderDirectorio();
        });

        if (universoActualTag) renderDetalle();
        else renderDirectorio();
    </script>
</body>
</html>
