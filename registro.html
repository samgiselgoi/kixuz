<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Entrar / Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.92);
            --borde: rgba(108, 60, 224, 0.42);
        }
        html[data-theme="light"] {
            --bg-principal: #F4F1FA;
            --bg-secundario: #6C3CE0;
            --acento: #0F9D8E;
            --texto: #150A24;
            --tarjeta: rgba(255, 255, 255, 0.94);
            --borde: rgba(108, 60, 224, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-principal);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            line-height: 1.5;
        }
        header {
            background: rgba(21, 10, 36, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }
        html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
        .logo { display: inline-flex; align-items: center; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nav-links a {
            color: var(--texto); text-decoration: none; padding: 6px 10px;
            border-radius: 8px; font-size: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
        }
        main {
            max-width: 480px;
            margin: 34px auto 90px;
            padding: 0 18px;
        }
        .panel {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        }
        h1 { font-family: 'Space Grotesk', sans-serif; color: var(--acento); font-size: 22px; margin-bottom: 6px; }
        .tabs-auth { display: flex; gap: 8px; margin: 14px 0 18px; }
        .auth-tab {
            flex: 1; padding: 9px 12px; border-radius: 10px; cursor: pointer;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
            background: rgba(108, 60, 224, 0.2); border: 1px solid var(--borde); color: var(--texto);
        }
        .auth-tab.active { background: var(--acento); color: #150A24; border-color: var(--acento); }
        .field { margin-bottom: 12px; }
        label {
            display: block; font-family: 'Space Grotesk', sans-serif; font-size: 12.5px;
            font-weight: 700; margin-bottom: 5px; color: var(--acento);
        }
        input {
            width: 100%; background: rgba(0, 0, 0, 0.35); color: var(--texto);
            border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px;
            font-family: 'Inter', sans-serif; font-size: 15px; outline: none;
        }
        html[data-theme="light"] input { background: #fff; color: #150A24; }
        .btn-submit {
            width: 100%; background: var(--acento); color: #150A24; border: none;
            border-radius: 10px; padding: 11px 16px; font-family: 'Space Grotesk', sans-serif;
            font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px;
        }
        .auth-msg {
            margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
            display: none; word-break: break-word;
        }
        .auth-msg.err {
            display: block; background: rgba(224, 60, 108, 0.18);
            border: 1px solid rgba(224, 60, 108, 0.55); color: #ff9bb4;
        }
        .auth-msg.ok {
            display: block; background: rgba(45, 212, 196, 0.16);
            border: 1px solid var(--acento); color: var(--acento);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 36px;">
        </a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>Cuenta Maestra KIXUZ</h1>
            <p style="font-size:13px;opacity:0.78;">Iniciá sesión o creá tu cuenta para acceder desde cualquier dispositivo.</p>

            <div class="tabs-auth">
                <button type="button" class="auth-tab active" id="tabLogin">Iniciar sesión</button>
                <button type="button" class="auth-tab" id="tabRegister">Crear cuenta</button>
            </div>

            <form id="authForm">
                <div class="field" id="apodoField" style="display:none;">
                    <label for="authApodo">Apodo / Cuenta Maestra</label>
                    <input type="text" id="authApodo" name="apodo" placeholder="Ej. Mi Cuenta Maestra" autocomplete="nickname">
                </div>

                <div class="field">
                    <label for="authEmail">Correo electrónico</label>
                    <input type="email" id="authEmail" name="email" inputmode="email" placeholder="tu-correo@ejemplo.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="authPassword">Contraseña</label>
                    <input type="password" id="authPassword" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-submit" id="authSubmitBtn">Iniciar sesión</button>
            </form>

            <div class="auth-msg" id="authMsg"></div>
        </section>
    </main>

    <script>
        (() => {
            let modo = 'login';
            const form = document.getElementById('authForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const apodoField = document.getElementById('apodoField');
            const submitBtn = document.getElementById('authSubmitBtn');
            const emailInput = document.getElementById('authEmail');
            const passInput = document.getElementById('authPassword');
            const apodoInput = document.getElementById('authApodo');
            const msgBox = document.getElementById('authMsg');

            function mostrarMensaje(tipo, texto) {
                msgBox.className = `auth-msg ${tipo}`;
                msgBox.textContent = texto;
            }

            function setModo(nuevoModo) {
                modo = nuevoModo;
                const esRegistro = modo === 'register';
                tabLogin.classList.toggle('active', !esRegistro);
                tabRegister.classList.toggle('active', esRegistro);
                apodoField.style.display = esRegistro ? 'block' : 'none';
                passInput.setAttribute('autocomplete', esRegistro ? 'new-password' : 'current-password');
                submitBtn.textContent = esRegistro ? 'Crear cuenta' : 'Iniciar sesión';
                msgBox.className = 'auth-msg';
                msgBox.textContent = '';
            }

            tabLogin.addEventListener('click', () => setModo('login'));
            tabRegister.addEventListener('click', () => setModo('register'));

            function leerEmailLimpio() {
                const candidatos = [
                    emailInput?.value,
                    form?.querySelector('input[type="email"]')?.value,
                    form?.querySelector('input[name="email"]')?.value
                ];
                for (const c of candidatos) {
                    const limpio = String(c || '').trim();
                    if (limpio) return limpio;
                }
                return '';
            }

            form.addEventListener('submit', async e => {
                e.preventDefault();
                const email = leerEmailLimpio();
                const password = String(passInput?.value || '');
                const apodo = String(apodoInput?.value || '').trim();

                if (!email) {
                    mostrarMensaje('err', 'Ingresá tu correo electrónico antes de continuar.');
                    emailInput?.focus();
                    return;
                }
                if (!password) {
                    mostrarMensaje('err', 'Ingresá tu contraseña.');
                    passInput?.focus();
                    return;
                }

                if (!window.KIXUZ_DB) {
                    mostrarMensaje('err', 'Firebase no configurado o aún cargando. Recargá la página.');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = modo === 'register' ? 'Creando cuenta...' : 'Entrando...';

                try {
                    if (modo === 'register') {
                        await window.KIXUZ_DB.registrarCuenta({ email, password, apodo });
                        mostrarMensaje('ok', 'Cuenta creada. Redirigiendo...');
                    } else {
                        await window.KIXUZ_DB.iniciarSesion({ email, password });
                        mostrarMensaje('ok', 'Sesión iniciada. Redirigiendo...');
                    }
                    setTimeout(() => { window.location.href = 'index.html'; }, 350);
                } catch (err) {
                    const code = err?.code || '';
                    const detail = err?.message || 'Error al autenticar';
                    mostrarMensaje('err', code ? `Firebase error (${code}): ${detail}` : detail);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = modo === 'register' ? 'Crear cuenta' : 'Iniciar sesión';
                }
            });
        })();
    </script>

    <script src="theme.js"></script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
