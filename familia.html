<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familia - KIXUZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(108, 60, 224, 0.14);
            --borde: rgba(108, 60, 224, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-principal);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            line-height: 1.55;
            overflow-x: hidden;
        }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        .page-wrap {
            max-width: 1020px;
            margin: 24px auto 80px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .panel-box {
            background-color: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-header h1 { font-size: 24px; color: var(--acento); }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 9px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            outline: none;
        }
        html[data-theme="light"] input,
        html[data-theme="light"] select { background: #fff; color: #150A24; }
        .btn-add {
            background: var(--acento);
            color: #150A24;
            border: none;
            border-radius: 10px;
            padding: 9px 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .btn-add:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-ghost {
            background: transparent;
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 9px;
            padding: 7px 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .inline-editor {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--acento);
            background: rgba(21, 10, 36, 0.78);
        }
        html[data-theme="light"] .inline-editor { background: rgba(255, 255, 255, 0.96); }
        .inline-editor.open { display: block; }
        .tree-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-top: 20px;
        }
        .gen-block {
            background: rgba(21, 10, 36, 0.36);
            border: 1px solid rgba(108, 60, 224, 0.28);
            border-radius: 14px;
            padding: 14px 12px;
        }
        html[data-theme="light"] .gen-block { background: rgba(108, 60, 224, 0.04); }
        .rank-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            color: var(--acento);
            margin-bottom: 12px;
            text-align: center;
        }
        .generation {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .member-card {
            width: 196px;
            background: rgba(21, 10, 36, 0.78);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 15px 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }
        html[data-theme="light"] .member-card { background: rgba(108, 60, 224, 0.07); }
        .member-card:hover {
            transform: translateY(-7px) scale(1.02);
            border-color: var(--acento);
            box-shadow: 0 14px 24px rgba(45, 212, 196, 0.22);
        }
        .member-card.self-card {
            border: 2px solid var(--acento);
            box-shadow: 0 0 16px rgba(45, 212, 196, 0.2);
        }
        .member-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--acento);
            background: #281445;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--acento);
            transition: transform 0.25s ease;
        }
        .member-card:hover .member-img { transform: scale(1.08); }
        .member-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14.5px; color: var(--acento); }
        .member-user { font-size: 12px; opacity: 0.78; }
        .member-relation {
            margin-top: 2px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(108, 60, 224, 0.28);
            border: 1px solid rgba(45, 212, 196, 0.38);
            font-size: 11px;
            font-weight: 700;
        }
        .card-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .mini-btn {
            background: rgba(108, 60, 224, 0.24);
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 7px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .mini-btn:hover { border-color: var(--acento); color: var(--acento); }
        .mini-btn.del { border-color: rgba(224, 60, 108, 0.55); color: #ff9bb4; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="brand" aria-label="KIXUZ Inicio">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 36px;">
        </a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html" class="active">Familia</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html">Entrar</a>
        </div>
    </header>

    <main class="page-wrap">
        <section class="panel-box top-header">
            <div>
                <h1 id="famTitulo">Árbol Familiar</h1>
                <div style="font-size: 13px; opacity: 0.8;" id="focoSubtitle">Cargando personaje...</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <a href="perfil.html" id="btnVerPerfilFoco" class="btn-ghost">Ver perfil</a>
            </div>
        </section>

        <section class="panel-box">
            <h2 style="font-size: 17px; color: var(--acento);">Agregar o Editar Familiar</h2>
            <p style="font-size: 12.5px; opacity: 0.78; margin-top: 2px;" id="famAyudaTexto">La generación y la relación inversa se calculan automáticamente al vincular.</p>

            <div class="form-row" id="formAgregarFamBox">
                <input type="text" id="famNombre" placeholder="Nombre del personaje">
                <input type="text" id="famHandle" placeholder="@Usuario (ej. @JerElyPrince)">
                <input type="text" id="famRelacion" placeholder="Relación (ej. Padre, Madre, Hija, Hijo, Pareja)">
                <select id="famGeneracion">
                    <option value="anterior">Generación Anterior</option>
                    <option value="actual" selected>Generación Actual</option>
                    <option value="siguiente">Siguiente Generación</option>
                </select>
                <button type="button" class="btn-add" id="btnAgregarFam">Agregar Vínculo</button>
            </div>

            <div class="inline-editor" id="inlineEditorBox">
                <div style="font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:700; color:var(--acento); margin-bottom:8px;" id="inlineEditorTitle">Editar miembro de la familia</div>
                <div class="form-row" style="margin-top:0;">
                    <input type="text" id="editFamNombre" placeholder="Nombre">
                    <input type="text" id="editFamHandle" placeholder="@Usuario">
                    <input type="text" id="editFamRelacion" placeholder="Relación">
                    <select id="editFamGeneracion">
                        <option value="anterior">Generación Anterior</option>
                        <option value="actual">Generación Actual</option>
                        <option value="siguiente">Siguiente Generación</option>
                    </select>
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;">
                    <button type="button" class="btn-ghost" id="btnCancelarEdit">Cancelar</button>
                    <button type="button" class="btn-add" id="btnGuardarEdit">Guardar cambios</button>
                </div>
            </div>

            <div class="tree-container">
                <div class="gen-block">
                    <div class="rank-label">Generación Anterior</div>
                    <div class="generation" id="gridAnterior"></div>
                </div>
                <div class="gen-block">
                    <div class="rank-label">Generación Actual</div>
                    <div class="generation" id="gridActual"></div>
                </div>
                <div class="gen-block">
                    <div class="rank-label">Siguiente Generación</div>
                    <div class="generation" id="gridSiguiente"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script src="characters.js"></script>
    <script src="theme.js"></script>
    <script src="navbar-ui.js"></script>
    <script src="chat.js"></script>
    <script>
        const STORAGE_KEY = 'kixuz_familia_clan_v1';
        const LEGACY_KEYS = ['kixuz_familia_clan_v5', 'kixuz_familia_clan_v4', 'kixuz_familia_clan_v3', 'kixuz_familia_clan_v2'];

        let dataStore = { familia: [], clan: [] };
        let focoChar = { nombre: 'Personaje', handle: '@rol', avatar: '' };
        let esFocoPropio = true;
        let avataresMap = new Map();
        let nombresMap = new Map();
        let indiceEditando = null;

        const esc = s => String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const norm = v => String(v || '').trim().toLowerCase();
        const normHandle = v => {
            const limp = norm(v).replace(/^@+/, '').replace(/\s+/g, '_');
            return limp ? '@' + limp : '';
        };

        function inferirGeneracion(rel, fallback = 'actual') {
            const r = norm(rel);
            if (r.includes('padre') || r.includes('madre') || r.includes('abuel') || r.includes('tío') || r.includes('tio') || r.includes('tía') || r.includes('tia')) return 'anterior';
            if (r.includes('hijo') || r.includes('hija') || r.includes('niet') || r.includes('sobrin')) return 'siguiente';
            if (r.includes('herman') || r.includes('pareja') || r.includes('espos') || r.includes('casad') || r.includes('primo') || r.includes('prima')) return 'actual';
            return fallback;
        }

        function calcularRelacionInversa(rel) {
            const r = norm(rel);
            if (r.includes('hija') || r.includes('hijo')) return 'Padre/Madre';
            if (r.includes('madre') || r.includes('padre')) return 'Hijo/a';
            if (r.includes('abuela') || r.includes('abuelo')) return 'Nieto/a';
            if (r.includes('nieto') || r.includes('nieta')) return 'Abuelo/a';
            if (r.includes('tía') || r.includes('tia') || r.includes('tío') || r.includes('tio')) return 'Sobrino/a';
            if (r.includes('sobrina') || r.includes('sobrino')) return 'Tío/a';
            if (r.includes('hermana') || r.includes('hermano')) return 'Hermano/a';
            if (r.includes('esposa')) return 'Esposo/a';
            if (r.includes('esposo')) return 'Esposa/o';
            if (r.includes('pareja')) return 'Pareja';
            return 'Vínculo familiar';
        }

        function obtenerPersonajeActivoExacto() {
            const ac = window.KIXUZ_ACTIVE_CHAR;
            if (ac && !ac.esPlaceholder && ac.handle) {
                return { nombre: ac.nombre || ac.handle.replace(/^@/, ''), handle: normHandle(ac.handle), avatar: ac.avatar || '' };
            }
            try {
                const act = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
                if (act?.handle) return { nombre: act.nombre || act.handle.replace(/^@/, ''), handle: normHandle(act.handle), avatar: act.avatar || '' };
                const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                if (Array.isArray(subs) && subs[0]?.handle) return { nombre: subs[0].nombre || subs[0].handle.replace(/^@/, ''), handle: normHandle(subs[0].handle), avatar: subs[0].avatar || '' };
            } catch {}
            return { nombre: 'Personaje', handle: '@rol', avatar: '' };
        }

        function leerObjetoStorage(k) {
            try {
                const raw = JSON.parse(localStorage.getItem(k) || 'null');
                if (raw && typeof raw === 'object') {
                    return {
                        familia: Array.isArray(raw.familia) ? raw.familia : [],
                        clan: Array.isArray(raw.clan) ? raw.clan : []
                    };
                }
            } catch {}
            return { familia: [], clan: [] };
        }

        function cargarDatos() {
            const famMap = new Map();
            const clanMap = new Map();
            [...LEGACY_KEYS.slice().reverse(), STORAGE_KEY].forEach(k => {
                const d = leerObjetoStorage(k);
                d.familia.forEach((item, i) => {
                    if (!item) return;
                    const duenoH = normHandle(item.duenoHandle || '');
                    const miembroH = normHandle(item.handle || item.nombre || '');
                    const relN = norm(item.relacion || '');
                    const key = String(item.id || `${duenoH}__${miembroH}__${relN}__${i}`);
                    famMap.set(key, {
                        ...famMap.get(key),
                        ...item,
                        duenoHandle: duenoH,
                        handle: miembroH
                    });
                });
                d.clan.forEach((item, i) => {
                    if (!item) return;
                    const key = String(item.id || `c_${i}`);
                    clanMap.set(key, { ...clanMap.get(key), ...item });
                });
            });
            dataStore = { familia: Array.from(famMap.values()), clan: Array.from(clanMap.values()) };
            guardarDatos();
        }

        function guardarDatos() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dataStore)); } catch {}
        }

        async function cargarDirectorioPersonajes() {
            const mAv = new Map();
            const mNom = new Map();
            const registrar = p => {
                if (!p) return;
                const h = normHandle(p.handle);
                if (!h) return;
                if (p.avatar) mAv.set(h, p.avatar);
                if (p.nombre) mNom.set(h, p.nombre);
            };
            registrar(focoChar);
            try {
                const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                if (Array.isArray(subs)) subs.forEach(registrar);
            } catch {}
            if (window.KIXUZ_DB?.listarPersonajesPublicos) {
                try {
                    const pub = await window.KIXUZ_DB.listarPersonajesPublicos();
                    if (Array.isArray(pub)) pub.forEach(registrar);
                } catch {}
            }
            avataresMap = mAv;
            nombresMap = mNom;
        }

        function renderAvatar(nombre, handle) {
            const img = avataresMap.get(normHandle(handle)) || '';
            if (img) return `<div class="member-img" style="background-image:url('${esc(img)}');"></div>`;
            return `<div class="member-img">${esc((nombre || 'P').charAt(0).toUpperCase())}</div>`;
        }

        // Determina si un registro de dataStore.familia pertenece al árbol de focoH
        // y qué relación/nombre/generación mostrar para ese otro personaje respecto a focoH
        function resolverEntradaParaFoco(item, focoH) {
            if (!item || !focoH) return null;
            const duenoH = normHandle(item.duenoHandle || '');
            const miembroH = normHandle(item.handle || '');
            if (!miembroH || miembroH === focoH) return null;

            // Caso 1: registro creado en el árbol de focoH (duenoH === focoH)
            if (duenoH === focoH) {
                const nombreResuelto = nombresMap.get(miembroH) || item.nombre || miembroH.replace(/^@/, '');
                const etiqueta = item.relacion || 'Vínculo familiar';
                const generacion = inferirGeneracion(etiqueta, item.generacion || 'actual');
                return {
                    nombre: nombreResuelto,
                    handle: miembroH,
                    etiqueta,
                    generacion,
                    esInverso: false
                };
            }

            // Caso 2: registro creado en el árbol de otro personaje (duenoH !== focoH)
            // donde miembroH es focoH -> el otro personaje es duenoH, con relación inversa
            if (duenoH && duenoH !== focoH && miembroH === focoH) {
                const invRel = calcularRelacionInversa(item.relacion);
                const genInv = inferirGeneracion(invRel, item.generacion === 'anterior' ? 'siguiente' : (item.generacion === 'siguiente' ? 'anterior' : 'actual'));
                const nombreOtro = nombresMap.get(duenoH) || item.duenoNombre || duenoH.replace(/^@/, '');
                return {
                    nombre: nombreOtro,
                    handle: duenoH,
                    etiqueta: invRel,
                    generacion: genInv,
                    esInverso: true
                };
            }

            // Caso 3: registro sin duenoHandle explícito
            if (!duenoH) {
                const nombreResuelto = nombresMap.get(miembroH) || item.nombre || miembroH.replace(/^@/, '');
                const etiqueta = item.relacion || 'Vínculo familiar';
                return {
                    nombre: nombreResuelto,
                    handle: miembroH,
                    etiqueta,
                    generacion: inferirGeneracion(etiqueta, item.generacion || 'actual'),
                    esInverso: false
                };
            }

            return null;
        }

        function cardHtml({ nombre, handle, etiqueta, esYo = false, index = -1, puedeEditar = false }) {
            const hNorm = normHandle(handle || '');
            const perfilHref = hNorm ? `perfil.html?char=${encodeURIComponent(hNorm)}` : 'perfil.html';
            const famHref = hNorm ? `familia.html?char=${encodeURIComponent(hNorm)}` : 'familia.html';
            return `
                <div class="member-card ${esYo ? 'self-card' : ''}">
                    ${renderAvatar(nombre, handle)}
                    <div class="member-name">${esYo ? '✨ ' : ''}${esc(nombre)}${esYo ? ' · Yo' : ''}</div>
                    <div class="member-user">${esc(handle || '@rol')}</div>
                    <div class="member-relation">${esc(etiqueta)}</div>
                    <div class="card-actions">
                        <a href="${esc(perfilHref)}" class="mini-btn">Perfil</a>
                        ${!esYo && hNorm ? `<a href="${esc(famHref)}" class="mini-btn">Familia</a>` : ''}
                        ${index >= 0 && puedeEditar ? `
                            <button type="button" class="mini-btn" data-edit="${index}" title="Editar">✏️</button>
                            <button type="button" class="mini-btn del" data-del="${index}" title="Eliminar">✖</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function abrirEditorInline(index) {
            if (!esFocoPropio) return;
            const item = dataStore.familia[index];
            if (!item) return;
            indiceEditando = index;
            document.getElementById('inlineEditorTitle').textContent = `Editando vínculo: ${item.nombre || item.handle}`;
            document.getElementById('editFamNombre').value = item.nombre || '';
            document.getElementById('editFamHandle').value = item.handle || '';
            document.getElementById('editFamRelacion').value = item.relacion || '';
            document.getElementById('editFamGeneracion').value = inferirGeneracion(item.relacion, item.generacion || 'actual');
            document.getElementById('inlineEditorBox').classList.add('open');
        }

        function cerrarEditorInline() {
            indiceEditando = null;
            document.getElementById('inlineEditorBox').classList.remove('open');
        }

        function renderArbol() {
            const focoH = normHandle(focoChar.handle);
            document.getElementById('famTitulo').textContent = `Familia de ${focoChar.nombre}`;
            document.getElementById('focoSubtitle').textContent = `${focoChar.nombre} (${focoChar.handle})${esFocoPropio ? '' : ' · Vista de personaje'}`;
            document.getElementById('btnVerPerfilFoco').href = `perfil.html?char=${encodeURIComponent(focoH)}`;
            document.getElementById('formAgregarFamBox').style.display = esFocoPropio ? 'grid' : 'none';
            document.getElementById('famAyudaTexto').textContent = esFocoPropio
                ? 'La generación y la relación inversa se calculan automáticamente al vincular.'
                : `Viendo el árbol familiar de ${focoChar.nombre} (${focoChar.handle}) en modo consulta.`;
            if (!esFocoPropio) cerrarEditorInline();

            // Evita duplicar el mismo handle relacionado en el mismo árbol priorizando los vínculos directos del foco
            const vistosHandle = new Set();
            const directos = [];
            const inversos = [];

            dataStore.familia.forEach((m, index) => {
                const res = resolverEntradaParaFoco(m, focoH);
                if (!res || res.handle === focoH) return;
                if (res.esInverso) inversos.push({ m, index, res });
                else directos.push({ m, index, res });
            });

            const combinados = [];
            [...directos, ...inversos].forEach(entry => {
                if (vistosHandle.has(entry.res.handle)) return;
                vistosHandle.add(entry.res.handle);
                combinados.push(entry);
            });

            document.getElementById('gridAnterior').innerHTML = combinados
                .filter(({ res }) => res.generacion === 'anterior')
                .map(({ index, res }) => cardHtml({
                    nombre: res.nombre,
                    handle: res.handle,
                    etiqueta: res.etiqueta,
                    index,
                    puedeEditar: esFocoPropio && !res.esInverso
                }))
                .join('') || `<div class="member-user">Sin vínculos en generación anterior.</div>`;

            const yoCard = cardHtml({ nombre: focoChar.nombre, handle: focoChar.handle, etiqueta: 'Yo', esYo: true });
            const actItemsHtml = combinados
                .filter(({ res }) => res.generacion === 'actual')
                .map(({ index, res }) => cardHtml({
                    nombre: res.nombre,
                    handle: res.handle,
                    etiqueta: res.etiqueta,
                    index,
                    puedeEditar: esFocoPropio && !res.esInverso
                }))
                .join('');
            document.getElementById('gridActual').innerHTML = yoCard + actItemsHtml;

            document.getElementById('gridSiguiente').innerHTML = combinados
                .filter(({ res }) => res.generacion === 'siguiente')
                .map(({ index, res }) => cardHtml({
                    nombre: res.nombre,
                    handle: res.handle,
                    etiqueta: res.etiqueta,
                    index,
                    puedeEditar: esFocoPropio && !res.esInverso
                }))
                .join('') || `<div class="member-user">Sin vínculos en siguiente generación.</div>`;

            if (esFocoPropio) {
                document.querySelectorAll('[data-del]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const i = Number(btn.dataset.del);
                        if (Number.isNaN(i)) return;
                        dataStore.familia.splice(i, 1);
                        if (indiceEditando === i) cerrarEditorInline();
                        guardarDatos();
                        renderArbol();
                    });
                });

                document.querySelectorAll('[data-edit]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const i = Number(btn.dataset.edit);
                        if (!Number.isNaN(i)) abrirEditorInline(i);
                    });
                });
            }
        }

        document.getElementById('famRelacion').addEventListener('input', e => {
            const genSel = document.getElementById('famGeneracion');
            genSel.value = inferirGeneracion(e.target.value, genSel.value || 'actual');
        });

        document.getElementById('editFamRelacion').addEventListener('input', e => {
            const genSel = document.getElementById('editFamGeneracion');
            genSel.value = inferirGeneracion(e.target.value, genSel.value || 'actual');
        });

        document.getElementById('btnCancelarEdit').addEventListener('click', cerrarEditorInline);

        document.getElementById('btnGuardarEdit').addEventListener('click', () => {
            if (!esFocoPropio || indiceEditando === null || !dataStore.familia[indiceEditando]) return;
            const item = dataStore.familia[indiceEditando];
            const nuevoNombre = document.getElementById('editFamNombre').value.trim();
            const nuevoHandle = normHandle(document.getElementById('editFamHandle').value.trim() || nuevoNombre);
            const nuevaRel = document.getElementById('editFamRelacion').value.trim() || item.relacion;
            const nuevaGen = inferirGeneracion(nuevaRel, document.getElementById('editFamGeneracion').value || 'actual');
            if (nuevoNombre) item.nombre = nuevoNombre;
            if (nuevoHandle) item.handle = nuevoHandle;
            item.relacion = nuevaRel;
            item.generacion = nuevaGen;
            guardarDatos();
            cerrarEditorInline();
            renderArbol();
        });

        document.getElementById('btnAgregarFam').addEventListener('click', () => {
            if (!esFocoPropio) return;
            const nombreInput = document.getElementById('famNombre').value.trim();
            const handle = normHandle(document.getElementById('famHandle').value.trim() || nombreInput);
            const relacion = document.getElementById('famRelacion').value.trim() || 'Vínculo familiar';
            const generacion = inferirGeneracion(relacion, document.getElementById('famGeneracion').value || 'actual');
            if (!handle) return;

            const duenoH = normHandle(focoChar.handle);
            if (handle === duenoH) return;

            const nombreFinal = nombreInput || nombresMap.get(handle) || handle.replace(/^@/, '');

            // Evita duplicar al mismo handle en el mismo árbol
            const yaExiste = dataStore.familia.some(x =>
                normHandle(x.duenoHandle) === duenoH && normHandle(x.handle) === handle
            );
            if (!yaExiste) {
                dataStore.familia.push({
                    id: 'fam_' + Date.now(),
                    duenoNombre: focoChar.nombre,
                    duenoHandle: duenoH,
                    nombre: nombreFinal,
                    handle,
                    relacion,
                    generacion
                });
            }

            guardarDatos();
            renderArbol();
            document.getElementById('famNombre').value = '';
            document.getElementById('famHandle').value = '';
            document.getElementById('famRelacion').value = '';
        });

        async function iniciar() {
            cargarDatos();
            const params = new URLSearchParams(window.location.search);
            const charParam = params.get('char') || '';
            const activo = obtenerPersonajeActivoExacto();

            if (charParam) {
                const limpio = normHandle(charParam);
                if (limpio === normHandle(activo.handle)) {
                    focoChar = activo;
                    esFocoPropio = true;
                } else {
                    let hallado = null;
                    try {
                        const subs = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
                        if (Array.isArray(subs)) {
                            hallado = subs.find(p => normHandle(p?.handle) === limpio) || null;
                        }
                    } catch {}
                    if (!hallado && window.KIXUZ_DB?.buscarPersonajePublico) {
                        try { hallado = await window.KIXUZ_DB.buscarPersonajePublico(limpio); } catch {}
                    }
                    if (hallado) {
                        focoChar = {
                            nombre: hallado.nombre || limpio.replace(/^@/, ''),
                            handle: normHandle(hallado.handle || limpio),
                            avatar: hallado.avatar || ''
                        };
                    } else {
                        focoChar = {
                            nombre: limpio.replace(/^@/, '') || 'Personaje',
                            handle: limpio || '@rol',
                            avatar: ''
                        };
                    }
                    esFocoPropio = window.KIXUZ_CHARS?.esPropietario ? window.KIXUZ_CHARS.esPropietario(hallado || focoChar) : false;
                }
            } else {
                focoChar = activo;
                esFocoPropio = true;
            }

            await cargarDirectorioPersonajes();
            renderArbol();
        }

        window.addEventListener('DOMContentLoaded', iniciar);
        window.addEventListener('kixuz:personajes-actualizados', iniciar);
        if (document.readyState !== 'loading') iniciar();
    </script>
</body>
</html>
