<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIXUZ — Crear Personaje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-principal: #150A24;
      --bg-secundario: #6C3CE0;
      --acento: #2DD4C4;
      --texto: #EDE7E0;
      --tarjeta: rgba(34, 18, 58, 0.9);
      --borde: rgba(108, 60, 224, 0.42);
    }
    html[data-theme="light"] {
      --bg-principal: #F4F1FA;
      --bg-secundario: #6C3CE0;
      --acento: #0F9D8E;
      --texto: #150A24;
      --tarjeta: rgba(255, 255, 255, 0.94);
      --borde: rgba(108, 60, 224, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-principal);
      color: var(--texto);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: rgba(21, 10, 36, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
    .logo { display: inline-flex; align-items: center; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nav-links a {
      color: var(--texto); text-decoration: none; padding: 6px 10px;
      border-radius: 8px; font-size: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    }
    .user-menu { display: flex; align-items: center; gap: 8px; }
    .user-menu select {
      background: rgba(0, 0, 0, 0.35); color: var(--texto);
      border: 1px solid var(--borde); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    }
    .btn-auth-link {
      background: var(--acento); color: #150A24 !important;
      padding: 6px 12px; border-radius: 8px; font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; font-weight: 700; text-decoration: none;
    }
    main {
      max-width: 780px;
      margin: 28px auto 90px;
      padding: 0 18px;
    }
    .panel {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
    }
    h1, h2 { font-family: 'Space Grotesk', sans-serif; color: var(--acento); }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--acento);
    }
    input, textarea, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.34);
      color: var(--texto);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      outline: none;
    }
    html[data-theme="light"] input,
    html[data-theme="light"] textarea,
    html[data-theme="light"] select { background: #fff; color: #150A24; }
    textarea { min-height: 85px; resize: vertical; }
    .btn-submit {
      background: var(--acento);
      color: #150A24;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 36px;">
    </a>
    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="perfil.html">Mi Perfil</a>
      <a href="universo.html">Universos</a>
      <a href="familia.html">Familia / Clan</a>
      <a href="crear-personaje.html" class="active">+ Personaje</a>
    </nav>
    <div class="user-menu">
      <select id="activeCharSelect" aria-label="Personaje activo"></select>
      <a href="registro.html" class="btn-auth-link">Entrar / Registro</a>
    </div>
  </header>

  <main>
    <section class="panel">
      <h1 style="font-size:22px;">Crear Personaje</h1>
      <p style="font-size:13.5px;opacity:0.78;margin-top:4px;">Se guardará en tu lista de personajes, se activará al instante y podrás editar su información y fotos cuando quieras.</p>

      <form id="createCharacterForm" style="margin-top:16px;">
        <div class="grid-2">
          <div class="field">
            <label for="charNombre">Nombre del personaje</label>
            <input type="text" id="charNombre" placeholder="Ej. Kaelen Vance" required>
          </div>
          <div class="field">
            <label for="charHandle">@Usuario</label>
            <input type="text" id="charHandle" placeholder="Ej. @kaelen" required>
          </div>
          <div class="field">
            <label for="charEspecies">Especie(s)</label>
            <input type="text" id="charEspecies" placeholder="Ej. Humano, Híbrido">
          </div>
          <div class="field">
            <label for="charGenero">Género</label>
            <input type="text" id="charGenero" placeholder="Ej. Masculino, Femenino, No binario">
          </div>
          <div class="field">
            <label for="charEdad">Edad</label>
            <input type="text" id="charEdad" placeholder="Ej. 24">
          </div>
          <div class="field">
            <label for="charClan">Familia / Clan</label>
            <input type="text" id="charClan" placeholder="Ej. Clan Eclipse">
          </div>
          <div class="field">
            <label for="charUniversos">Universo(s) (separados por coma)</label>
            <input type="text" id="charUniversos" placeholder="Ej. #NexoCentral">
          </div>
          <div class="field">
            <label for="charAvatarFile">Foto de perfil</label>
            <input type="file" id="charAvatarFile" accept="image/*" style="font-size:12px;">
          </div>
          <div class="field">
            <label for="charBannerFile">Banner del perfil</label>
            <input type="file" id="charBannerFile" accept="image/*" style="font-size:12px;">
          </div>
          <div class="field">
            <label for="charBgFile">Fondo de la página</label>
            <input type="file" id="charBgFile" accept="image/*" style="font-size:12px;">
          </div>
        </div>

        <div class="field">
          <label for="charBio">Biografía</label>
          <textarea id="charBio" placeholder="Escribe la biografía o trasfondo del personaje..."></textarea>
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <button type="submit" class="btn-submit">Guardar y abrir perfil</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const KEY_LISTA = 'kixuz_subpersonajes';
      const KEY_ACTIVO = 'kixuz_personaje_activo';

      const normH = v => {
        const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
        return s ? '@' + s : '';
      };

      function comprimirImagen(file, maxAncho, calidad) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = e => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
              let w = img.width, h = img.height;
              if (w > maxAncho) { h = Math.round((h * maxAncho) / w); w = maxAncho; }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', calidad));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      let avatarData = '';
      let bannerData = '';
      let bgData = '';

      document.getElementById('charAvatarFile')?.addEventListener('change', async e => {
        const f = e.target.files?.[0];
        if (f) avatarData = await comprimirImagen(f, 320, 0.8);
      });
      document.getElementById('charBannerFile')?.addEventListener('change', async e => {
        const f = e.target.files?.[0];
        if (f) bannerData = await comprimirImagen(f, 900, 0.72);
      });
      document.getElementById('charBgFile')?.addEventListener('change', async e => {
        const f = e.target.files?.[0];
        if (f) bgData = await comprimirImagen(f, 1100, 0.72);
      });

      document.getElementById('createCharacterForm')?.addEventListener('submit', async e => {
        e.preventDefault();
        const nombre = document.getElementById('charNombre').value.trim();
        const handle = normH(document.getElementById('charHandle').value);
        if (!nombre || !handle) return;

        const nuevoPersonaje = {
          id: 'pj_' + Date.now(),
          nombre,
          handle,
          especies: document.getElementById('charEspecies').value.split(',').map(s => s.trim()).filter(Boolean),
          genero: document.getElementById('charGenero').value.trim(),
          edadAparente: document.getElementById('charEdad').value.trim(),
          clan: document.getElementById('charClan').value.trim(),
          universos: document.getElementById('charUniversos').value.split(',').map(u => u.trim()).filter(Boolean).map(u => u.startsWith('#') ? u : '#' + u.replace(/^#+/, '')),
          bio: document.getElementById('charBio').value.trim(),
          avatar: avatarData,
          banner: bannerData,
          fondoImagen: bgData,
          habilidades: [],
          debilidades: []
        };

        let lista = [];
        try { lista = JSON.parse(localStorage.getItem(KEY_LISTA) || '[]'); } catch {}
        if (!Array.isArray(lista)) lista = [];
        lista = lista.filter(p => normH(p?.handle) !== handle);
        lista.push(nuevoPersonaje);

        localStorage.setItem(KEY_LISTA, JSON.stringify(lista));
        localStorage.setItem(KEY_ACTIVO, JSON.stringify(nuevoPersonaje));
        window.KIXUZ_ACTIVE_CHAR = nuevoPersonaje;

        if (window.KIXUZ_DB?.guardarSubpersonaje) {
          try { await window.KIXUZ_DB.guardarSubpersonaje(nuevoPersonaje); } catch {}
        }

        window.dispatchEvent(new Event('kixuz:personajes-actualizados'));
        window.location.href = `perfil.html?char=${encodeURIComponent(handle)}`;
      });
    })();
  </script>

  <script src="chat.js"></script>
  <script src="theme.js"></script>
  <script src="characters.js"></script>
  <script src="buscador-global.js"></script>
  <script src="navbar-ui.js"></script>
  <script src="notificaciones.js"></script>
  <script src="amigos.js"></script>
  <script type="module" src="firebase-config.js"></script>
</body>
</html>
