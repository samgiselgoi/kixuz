<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIXUZ — Crear Personaje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #150A24;
            --bg-secundario: #6C3CE0;
            --acento: #2DD4C4;
            --texto: #EDE7E0;
            --tarjeta: rgba(34, 18, 58, 0.92);
            --borde: rgba(108, 60, 224, 0.4);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-principal);
            color: var(--texto);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        header {
            position: relative;
            z-index: 900;
            background: rgba(21, 10, 36, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borde);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: nowrap;
        }
        @media (max-width: 980px) {
            header { flex-wrap: wrap; }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--texto);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(108, 60, 224, 0.28);
            color: var(--acento);
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #activeCharSelect {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            background: rgba(15, 8, 28, 0.9);
            color: var(--texto);
            font-size: 13px;
        }
        main {
            max-width: 980px;
            margin: 24px auto;
            padding: 0 16px 75px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 18px 20px;
        }
        .btn {
            background: var(--acento);
            color: #150A24;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-secondary {
            background: rgba(108, 60, 224, 0.28);
            color: var(--texto);
            border: 1px solid var(--borde);
        }
        .btn-danger {
            background: rgba(224, 60, 108, 0.2);
            color: #ff9bb4;
            border: 1px solid rgba(224, 60, 108, 0.5);
        }
        .tag-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(45, 212, 196, 0.16);
            color: var(--acento);
            border: 1px solid rgba(45, 212, 196, 0.4);
            text-decoration: none;
        }
        .muted { opacity: 0.75; font-size: 13px; }
        .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(0, 0, 0, 0.3);
            color: var(--texto);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        textarea { resize: vertical; }
        .post-card {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .post-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: 15px;
        }
        .comment-box {
            background: rgba(21, 10, 36, 0.65);
            border: 1px solid rgba(108, 60, 224, 0.28);
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 13.5px;
        }
        .tab-btn {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--borde);
            background: rgba(21, 10, 36, 0.65);
            color: var(--texto);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--acento);
            color: #150A24;
            border-color: var(--acento);
        }
</style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" style="display:inline-flex; align-items:center; text-decoration:none;">
            <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height:36px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
            <span style="display:none; color:var(--acento); font-weight:800; font-family:'Unbounded',sans-serif;">KIXUZ</span>
        </a>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="perfil.html">Mi Perfil</a>
            <a href="universo.html">Universos</a>
            <a href="familia.html">Familia / Clan</a>
            <a href="cuenta-maestra.html">Cuenta Maestra</a>
        </nav>
        <div class="user-menu">
            <select id="activeCharSelect" aria-label="Personaje activo"></select>
            <a href="registro.html" class="btn-auth-link" title="Entrar / Registro" aria-label="Entrar / Registro" style="text-decoration:none;">🔑</a>
        </div>
    </header>
    <main>
        <section class="card">
            <h1 style="margin:0 0 12px; font-family:'Space Grotesk',sans-serif; font-size:22px;">🎭 Crear Nuevo Sub-personaje</h1>
            <form id="createCharForm" style="display:flex; flex-direction:column; gap:12px;">
                <div class="grid-2">
                    <div>
                        <label class="muted">Nombre del personaje *</label>
                        <input type="text" id="charNombreInput" required placeholder="Ej. Demian Prince">
                    </div>
                    <div>
                        <label class="muted">Usuario / @handle *</label>
                        <input type="text" id="charHandleInput" required placeholder="Ej. @Asmodeus">
                    </div>
                    <div>
                        <label class="muted">Especie / Raza</label>
                        <input type="text" id="charEspecieInput" placeholder="Ej. Demonio / Humano / Elfo">
                    </div>
                    <div>
                        <label class="muted">Edad</label>
                        <input type="text" id="charEdadInput" placeholder="Ej. 24 años">
                    </div>
                    <div>
                        <label class="muted">Familia / Clan principal</label>
                        <input type="text" id="charClanInput" placeholder="Ej. Casa Prince">
                    </div>
                    <div>
                        <label class="muted">Universos (separados por coma)</label>
                        <input type="text" id="charUniversoInput" placeholder="Ej. #Nocturna, #Academia">
                    </div>
                    <div>
                        <label class="muted">Imagen de Avatar</label>
                        <input type="file" id="charAvatarInput" accept="image/*">
                    </div>
                    <div>
                        <label class="muted">Imagen de Banner</label>
                        <input type="file" id="charBannerInput" accept="image/*">
                    </div>
                </div>
                <div>
                    <label class="muted">Biografía / Historia</label>
                    <textarea id="charBioInput" rows="3" placeholder="Historia, personalidad, habilidades..."></textarea>
                </div>
                <div><button type="submit" class="btn">Guardar y abrir perfil →</button></div>
            </form>
        </section>
        <section class="card">
            <h2 style="margin:0 0 12px; font-family:'Space Grotesk',sans-serif; font-size:18px;">Tus sub-personajes creados</h2>
            <div id="myCharsList"></div>
        </section>
    </main>
    <script type="module" src="firebase-config.js"></script>
    <script src="characters.js"></script>
    <script src="theme.js"></script>
    <script src="kixuz-72h-aviso.js"></script>
    <script src="kixuz-admin-master.js"></script>
    <script src="chat.js"></script>

    <script>
        (() => {
            const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const normHandle = v => {
                const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
                return s ? '@' + s : '';
            };

            let avatarB64 = '';
            let bannerB64 = '';

            function comprimirImagen(file, maxW = 720, quality = 0.78) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        const img = new Image();
                        img.onload = () => {
                            const scale = Math.min(1, maxW / (img.width || maxW));
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round((img.width || maxW) * scale));
                            canvas.height = Math.max(1, Math.round((img.height || maxW) * scale));
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.onerror = reject;
                        img.src = ev.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            document.getElementById('charAvatarInput').addEventListener('change', async e => {
                const f = e.target.files?.[0];
                if (f) avatarB64 = await comprimirImagen(f, 360, 0.8);
            });

            document.getElementById('charBannerInput').addEventListener('change', async e => {
                const f = e.target.files?.[0];
                if (f) bannerB64 = await comprimirImagen(f, 960, 0.78);
            });

            function renderMisPersonajes() {
                const cont = document.getElementById('myCharsList');
                const lista = window.KIXUZ_CHARS?.obtenerSubpersonajes ? window.KIXUZ_CHARS.obtenerSubpersonajes() : [];
                if (!lista.length) {
                    cont.innerHTML = '<div class="muted">Todavía no creaste sub-personajes en esta cuenta.</div>';
                    return;
                }
                cont.innerHTML = '';
                lista.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'row-between';
                    card.style.cssText = 'padding:12px 14px; border:1px solid var(--borde); border-radius:12px; margin-bottom:8px; background:rgba(21,10,36,0.65);';
                    card.innerHTML = `
                        <div style="display:flex; align-items:center; gap:10px;">
                            ${p.avatar ? `<img src="${esc(p.avatar)}" alt="${esc(p.nombre)}" style="width:42px; height:42px; border-radius:50%; object-fit:cover;">` : ''}
                            <div>
                                <strong>${esc(p.nombre)}</strong> <span class="muted">${esc(p.handle || '')}</span>
                                <div class="muted">${esc(p.especie || '')} ${p.clan ? '· ' + esc(p.clan) : ''}</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <a href="perfil.html?char=${encodeURIComponent(p.handle || p.nombre)}" class="btn btn-secondary" style="padding:5px 10px; font-size:12px;">Abrir perfil →</a>
                            <button type="button" class="btn btn-danger btn-del-char" style="padding:5px 10px; font-size:12px;">🗑️</button>
                        </div>
                    `;
                    card.querySelector('.btn-del-char').addEventListener('click', async () => {
                        if (!confirm(`¿Eliminar el sub-personaje ${p.nombre}?`)) return;
                        if (window.KIXUZ_DB?.eliminarSubpersonaje) {
                            await window.KIXUZ_DB.eliminarSubpersonaje(p.handle, p.id);
                        }
                        renderMisPersonajes();
                    });
                    cont.appendChild(card);
                });
            }

            document.getElementById('createCharForm').addEventListener('submit', async e => {
                e.preventDefault();
                const nombre = document.getElementById('charNombreInput').value.trim();
                const handle = normHandle(document.getElementById('charHandleInput').value || nombre);
                const especie = document.getElementById('charEspecieInput').value.trim();
                const edad = document.getElementById('charEdadInput').value.trim();
                const clan = document.getElementById('charClanInput').value.trim();
                const uniRaw = document.getElementById('charUniversoInput').value.trim();
                const bio = document.getElementById('charBioInput').value;

                if (!nombre || !handle) return;

                const universos = uniRaw
                    ? uniRaw.split(',').map(x => x.trim()).filter(Boolean).map(x => x.startsWith('#') ? x : '#' + x.replace(/\s+/g, ''))
                    : [];

                const uid = window.KIXUZ_DB?.usuarioActual?.uid || window.KIXUZ_DB?.perfilCuenta?.uid || '';
                const nuevo = {
                    nombre,
                    handle,
                    especie,
                    edad,
                    clan,
                    universos,
                    bio,
                    avatar: avatarB64,
                    banner: bannerB64,
                    uidMaestro: uid
                };

                if (window.KIXUZ_DB?.guardarSubpersonaje) {
                    await window.KIXUZ_DB.guardarSubpersonaje(nuevo);
                } else {
                    const arr = window.KIXUZ_CHARS?.obtenerSubpersonajes ? window.KIXUZ_CHARS.obtenerSubpersonajes() : [];
                    arr.push(nuevo);
                    localStorage.setItem('kixuz_subpersonajes', JSON.stringify(arr));
                    localStorage.setItem('kixuz_personaje_activo', JSON.stringify(nuevo));
                    window.dispatchEvent(new Event('kixuz:personajes-actualizados'));
                }

                window.location.href = `perfil.html?char=${encodeURIComponent(handle)}`;
            });

            window.addEventListener('DOMContentLoaded', renderMisPersonajes);
            window.addEventListener('kixuz:personajes-actualizados', renderMisPersonajes);
        })();
    </script>

</body>
</html>
