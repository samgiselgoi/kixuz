<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <title>KIXUZ — Ficha de Personaje</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-principal: #150A24;
      --bg: #150A24;
      --card: #1F1135;
      --card-2: #281644;
      --border: rgba(108, 60, 224, 0.35);
      --borde: rgba(108, 60, 224, 0.35);
      --primary: #6C3CE0;
      --accent: #2DD4C4;
      --acento: #2DD4C4;
      --texto: #EDE7E0;
      --muted: rgba(237, 231, 224, 0.65);
    }
    html[data-theme="light"] {
      --bg-principal: #F4F1FA;
      --bg: #F4F1FA;
      --card: #FFFFFF;
      --card-2: #EFE9FA;
      --border: rgba(108, 60, 224, 0.25);
      --borde: rgba(108, 60, 224, 0.25);
      --texto: #150A24;
      --muted: rgba(21, 10, 36, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    header {
      background: rgba(21, 10, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    .char-select {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--texto);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .container {
      max-width: 1040px;
      margin: 22px auto 70px;
      padding: 0 18px;
    }
    .profile-hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .profile-banner {
      height: 170px;
      background: linear-gradient(135deg, #3A1C71, #6C3CE0, #165B6D);
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .visitor-pill {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(21, 10, 36, 0.85);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
    }
    .profile-body {
      padding: 0 22px 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: -42px;
      position: relative;
    }
    .profile-id {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .avatar-circle {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 4px solid var(--card);
      background: linear-gradient(135deg, #6C3CE0, #2DD4C4);
      background-size: cover;
      background-position: center;
      color: #150A24;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(108, 60, 224, 0.24);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--primary);
      color: #EDE7E0;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--texto);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 18px;
    }
    @media (max-width: 820px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand" aria-label="KIXUZ Inicio">
      <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 34px;">
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="perfil.html">Mi Personaje</a>
      <a href="universo.html">Universos</a>
      <a href="familia.html">Familia / Clan</a>
    </nav>
    <div class="user-menu">
      <select id="activeCharSelect" class="char-select" aria-label="Personaje activo"></select>
      <a href="registro.html">Entrar</a>
    </div>
  </header>

  <main class="container">
    <section class="profile-hero">
      <div id="profileBanner" class="profile-banner">
        <span id="visitorBadge" class="visitor-pill" style="display:none;">Modo Visitante · Solo lectura</span>
      </div>
      <div class="profile-body">
        <div class="profile-id">
          <div id="profileAvatar" class="avatar-circle">K</div>
          <div style="padding-bottom:4px;">
            <h1 id="profileName" style="font-family:'Space Grotesk',sans-serif;font-size:24px;">Cargando...</h1>
            <div id="profileHandle" style="color:var(--accent);font-weight:700;font-size:14px;margin:2px 0 8px;">@rol</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;" id="charTagsRow">
              <a id="profileUniverse" href="universo.html" class="badge">#NexoCentral</a>
              <a id="profileClan" href="familia.html" class="badge">Familia / Clan</a>
            </div>
          </div>
        </div>
        <div id="ownerActions" style="display:flex;gap:8px;flex-wrap:wrap;">
          <a href="crear-personaje.html" class="btn btn-ghost">+ Nuevo personaje</a>
          <a href="cuenta-maestra.html" class="btn">Mi Cuenta Maestra</a>
        </div>
      </div>
    </section>

    <div class="grid-2">
      <aside>
        <div class="card">
          <h2 style="font-family:'Space Grotesk',sans-serif;font-size:16px;margin-bottom:10px;color:var(--accent);">Expediente & Trasfondo</h2>
          <p id="profileBio" style="line-height:1.6;font-size:14px;color:var(--muted);">Sin biografía registrada.</p>
          <div id="profileExtraFields" style="margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;"></div>
        </div>
      </aside>
      <section>
        <h3 style="font-family:'Space Grotesk',sans-serif;font-size:16px;margin-bottom:12px;">Crónicas & Publicaciones</h3>
        <div id="profilePosts"></div>
      </section>
    </div>
  </main>

  <script>
    const normH = v => {
      const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
      return s ? '@' + s : '';
    };

    async function cargarPerfil() {
      const params = new URLSearchParams(window.location.search);
      const charParam = params.get('char') || '';

      let subs = [];
      try {
        const raw = JSON.parse(localStorage.getItem('kixuz_subpersonajes') || '[]');
        if (Array.isArray(raw)) subs = raw.filter(p => p && (p.nombre || p.handle));
      } catch {}

      let activo = null;
      try {
        activo = JSON.parse(localStorage.getItem('kixuz_personaje_activo') || 'null');
      } catch {}
      if (!activo && subs.length) activo = subs[0];

      const targetH = normH(charParam || activo?.handle || '');
      let info = subs.find(p => normH(p.handle) === targetH) || (normH(activo?.handle) === targetH ? activo : null);
      let esVisitante = !info;

      if (!info && window.KIXUZ_DB?.buscarPersonajePublico && targetH) {
        try {
          const pub = await window.KIXUZ_DB.buscarPersonajePublico(targetH);
          if (pub) info = pub;
        } catch {}
      }

      if (!info) {
        info = {
          nombre: (charParam || 'Personaje').replace(/^@+/, ''),
          handle: targetH || '@rol',
          bio: 'Perfil en modo visitante.',
          universos: ['#NexoCentral'],
          clan: 'Familia / Clan'
        };
      }

      const esAdmin = Boolean(window.KIXUZ_DB?.esAdmin);
      document.getElementById('visitorBadge').style.display = (esVisitante && !esAdmin) ? 'inline-block' : 'none';
      document.getElementById('ownerActions').style.display = (!esVisitante || esAdmin) ? 'flex' : 'none';

      const avatarEl = document.getElementById('profileAvatar');
      if (info.avatar) {
        avatarEl.style.backgroundImage = `url('${info.avatar}')`;
        avatarEl.textContent = '';
      } else {
        avatarEl.style.backgroundImage = '';
        avatarEl.textContent = (info.nombre || 'P').charAt(0).toUpperCase();
      }

      const bannerEl = document.getElementById('profileBanner');
      if (info.banner) {
        bannerEl.style.backgroundImage = `url('${info.banner}')`;
      }

      document.getElementById('profileName').textContent = info.nombre || 'Personaje';
      document.getElementById('profileHandle').textContent = info.handle || targetH;
      document.getElementById('profileBio').textContent = info.bio || 'Sin biografía registrada.';

      const uni = Array.isArray(info.universos) && info.universos[0] ? info.universos[0] : (info.universo || '#NexoCentral');
      const uniEl = document.getElementById('profileUniverse');
      uniEl.textContent = uni;
      uniEl.href = `universo.html?u=${encodeURIComponent(uni.replace(/^#/, ''))}`;

      const clanEl = document.getElementById('profileClan');
      clanEl.textContent = info.clan || 'Familia / Clan';
      clanEl.href = `familia.html?char=${encodeURIComponent(info.handle || targetH)}`;

      const extraEl = document.getElementById('profileExtraFields');
      const campos = [
        info.edad ? `<strong>Edad:</strong> ${info.edad}` : '',
        info.especie ? `<strong>Especie / Raza:</strong> ${info.especie}` : '',
        info.ocupacion ? `<strong>Rol / Ocupación:</strong> ${info.ocupacion}` : ''
      ].filter(Boolean);
      extraEl.innerHTML = campos.map(c => `<div>${c}</div>`).join('');

      let posts = [];
      try {
        const p1 = JSON.parse(localStorage.getItem('kixuz_posts_v1') || '[]');
        const p2 = JSON.parse(localStorage.getItem('kixuz_posts') || '[]');
        posts = [...p1, ...p2].filter(p => normH(p.autorHandle || p.handle) === (info.handle || targetH));
      } catch {}

      const postsBox = document.getElementById('profilePosts');
      postsBox.innerHTML = posts.length
        ? posts.map(p => `<article class="post-card"><div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${p.universo || p.universe || ''}</div><p style="line-height:1.55;">${p.texto || p.text || ''}</p></article>`).join('')
        : `<div class="card" style="color:var(--muted);font-size:14px;">Este personaje aún no tiene publicaciones en el muro.</div>`;
    }

    window.addEventListener('DOMContentLoaded', cargarPerfil);
    window.addEventListener('kixuz:personajes-actualizados', cargarPerfil);
  </script>

  <script src="chat.js"></script>
  <script src="theme.js"></script>
  <script src="characters.js"></script>
  <script src="buscador-global.js"></script>
  <script src="navbar-ui.js"></script>
  <script src="notificaciones.js"></script>
  <script src="amigos.js"></script>
  <script type="module" src="firebase-config.js"></script>
</body>
</html>
