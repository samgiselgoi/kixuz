<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <title>KIXUZ — Perfil de Personaje</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-principal: #150A24;
      --bg: #150A24;
      --bg-secundario: #6C3CE0;
      --card: #1F1135;
      --card-2: #281644;
      --border: rgba(108, 60, 224, 0.35);
      --borde: rgba(108, 60, 224, 0.35);
      --primary: #6C3CE0;
      --accent: #2DD4C4;
      --acento: #2DD4C4;
      --texto: #EDE7E0;
      --muted: rgba(237, 231, 224, 0.68);
    }
    html[data-theme="light"] {
      --bg-principal: #F4F1FA;
      --bg: #F4F1FA;
      --card: #FFFFFF;
      --card-2: #EFE9FA;
      --border: rgba(108, 60, 224, 0.25);
      --borde: rgba(108, 60, 224, 0.25);
      --texto: #150A24;
      --muted: rgba(21, 10, 36, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    body.kixuz-custom-bg {
      background-size: cover !important;
      background-position: center !important;
      background-attachment: fixed !important;
    }
    header {
      background: rgba(21, 10, 36, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    html[data-theme="light"] header { background: rgba(255, 255, 255, 0.92); }
    .brand { display: inline-flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .dropdown {
      height: 38px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--texto);
      font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px;
      outline: none; cursor: pointer;
    }

    .profile-layout {
      max-width: 1120px; margin: 24px auto 80px; padding: 0 18px;
      display: grid; grid-template-columns: 345px 1fr; gap: 22px; align-items: start;
    }
    @media (max-width: 860px) { .profile-layout { grid-template-columns: 1fr; } }

    .character-sidebar {
      position: sticky; top: 76px; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    }
    @media (max-width: 860px) { .character-sidebar { position: static; } }

    .card-banner {
      height: 118px; background: linear-gradient(135deg, #3A1C71, #6C3CE0, #165B6D);
      background-size: cover; background-position: center; position: relative;
    }
    .character-identity { padding: 0 18px 14px; }
    .avatar-top-bar {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-top: -46px; position: relative; z-index: 2;
    }
    .avatar-circle {
      width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--acento);
      background: linear-gradient(135deg, #6C3CE0, #2DD4C4);
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 28px; color: #150A24;
    }

    .friend-icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--acento); background: rgba(21, 10, 36, 0.88);
      color: var(--acento); font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .friend-icon-btn:hover { background: var(--acento); color: #150A24; }
    .friend-icon-btn.is-friend {
      background: rgba(45, 212, 196, 0.2); color: var(--acento); cursor: default;
    }

    .character-identity h1 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin-top: 8px; }
    .profile-username-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 3px; font-size: 13px;
    }
    .profile-username { color: var(--acento); font-weight: 700; }
    .inline-partner-rel {
      color: var(--texto); font-weight: 600; font-size: 12.5px;
    }
    .inline-partner-rel a {
      color: var(--acento); font-weight: 700; text-decoration: none;
    }
    .inline-partner-rel a:hover { text-decoration: underline; }

    .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .info-tag {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 999px; font-size: 11.5px; font-weight: 600; text-decoration: none;
      background: rgba(108, 60, 224, 0.22); border: 1px solid var(--border); color: var(--acento);
    }
    .info-tag:hover { border-color: var(--acento); }

    .kixuz-profile-edit-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .kixuz-edit-btn {
      flex: 1; min-width: 120px; background: rgba(108, 60, 224, 0.22);
      color: var(--texto); border: 1px solid rgba(45, 212, 196, 0.55);
      border-radius: 9px; padding: 7px 10px; font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .kixuz-edit-btn:hover { background: var(--acento); color: #150A24; }

    .character-sidebar details { border-top: 1px solid var(--border); padding: 12px 18px; }
    .character-sidebar summary {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13.5px;
      cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
    }

    .stat-row {
      margin-top: 8px;
      font-size: 12.5px;
    }
    .stat-row-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;
    }
    .stat-bar-bg {
      width: 100%; height: 6px; border-radius: 999px; background: rgba(108, 60, 224, 0.25); overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%; border-radius: 999px; background: var(--acento);
    }
    .stat-bar-fill.weak {
      background: #ff7b7b;
    }

    .friend-row-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 6px 9px; border-radius: 8px; background: rgba(108, 60, 224, 0.16);
      border: 1px solid var(--border); font-size: 12px; margin-top: 6px;
    }
    .friend-row-item a { color: var(--acento); font-weight: 700; text-decoration: none; }

    .profile-wall { display: flex; flex-direction: column; gap: 16px; }
    .create-post { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    .create-post textarea {
      width: 100%; background: var(--card-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; color: var(--texto);
      font-family: 'Inter', sans-serif; font-size: 14px; outline: none; resize: vertical; min-height: 76px;
    }
    .create-post-controls {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; margin-top: 10px;
    }
    .create-post-controls select, .create-post-controls input {
      width: 100%; background: var(--card-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; color: var(--texto);
      font-family: 'Inter', sans-serif; font-size: 13px; outline: none;
    }
    .create-post-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    .btn-publish {
      height: 36px; padding: 0 16px; border-radius: 10px; border: none;
      background: var(--acento); color: #150A24; font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 13px; cursor: pointer;
    }

    .mode-switch-group {
      display: inline-flex; align-items: center; background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border); border-radius: 999px; padding: 2px; gap: 2px;
    }
    .mode-btn {
      border: none; background: transparent; color: var(--texto);
      font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 999px; cursor: pointer;
    }
    .mode-btn.active.ic { background: var(--acento); color: #150A24; }
    .mode-btn.active.oc { background: var(--bg-secundario); color: #EDE7E0; }
    .mode-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .mode-badge.ic { background: rgba(45, 212, 196, 0.18); color: var(--acento); border: 1px solid rgba(45, 212, 196, 0.45); }
    .mode-badge.oc { background: rgba(108, 60, 224, 0.25); color: #c4b0ff; border: 1px solid rgba(108, 60, 224, 0.55); }

    @keyframes kixFlamePulse {
      0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 2px rgba(255, 138, 43, 0.45)); }
      50% { transform: scale(1.13) translateY(-1px); filter: drop-shadow(0 0 7px rgba(255, 102, 51, 0.85)); }
    }
    .kix-flame-svg { width: 15px; height: 15px; flex-shrink: 0; }
    .kix-btn.liked .kix-flame-svg { animation: kixFlamePulse 1.15s ease-in-out infinite; }

    .post-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
    }
    .post-author-chain {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; font-size: 13.5px;
    }
    .post-author-chain a { color: var(--acento); text-decoration: none; }
    .post-author-chain a:hover { text-decoration: underline; }
    .post-chain-sep { color: var(--muted); font-weight: 700; }
    .post-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .post-pill {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      text-decoration: none; background: rgba(108, 60, 224, 0.22);
      border: 1px solid var(--border); color: var(--acento);
    }
    .kix-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(108, 60, 224, 0.18); border: 1px solid var(--border);
      color: var(--texto); border-radius: 8px; padding: 5px 11px;
      font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .kix-btn.liked { border-color: #ff7b39; background: rgba(255, 123, 57, 0.16); color: #ffa672; }
    .comment-form { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
    .comment-form input {
      flex: 1; min-width: 150px; background: var(--card-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; color: var(--texto); font-size: 12.5px; outline: none;
    }
    .comment-btn {
      background: rgba(108, 60, 224, 0.26); border: 1px solid var(--border);
      color: var(--texto); border-radius: 8px; padding: 6px 12px;
      font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .kixuz-modal-backdrop {
      position: fixed; inset: 0; background: rgba(10, 4, 20, 0.78); backdrop-filter: blur(6px);
      z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .kixuz-modal {
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      background: var(--bg-principal); color: var(--texto);
      border: 1px solid var(--acento); border-radius: 16px; padding: 20px;
    }
    .kixuz-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .kixuz-modal-field { margin-bottom: 8px; }
    .kixuz-modal-field.full { grid-column: 1 / -1; }
    .kixuz-modal-field label {
      display: block; font-family: 'Space Grotesk', sans-serif; font-size: 12px;
      font-weight: 700; margin-bottom: 4px; color: var(--acento);
    }
    .kixuz-modal-field input, .kixuz-modal-field select, .kixuz-modal-field textarea {
      width: 100%; padding: 8px 10px; background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border); border-radius: 8px; color: var(--texto);
      font-family: 'Inter', sans-serif; font-size: 13px; outline: none;
    }
  
/* === KIXUZ UNIFIED MOBILE & TABLET ADAPTATION === */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}
img, video, svg {
  max-width: 100%;
}
@media (max-width: 768px) {
  header {
    padding: 10px 12px !important;
    gap: 8px !important;
  }
  .nav-links {
    width: 100%;
    order: 3;
    gap: 6px !important;
    justify-content: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;

    white-space: nowrap;

    flex-wrap: wrap;

  }
  .user-menu select,
  .dropdown {

    padding: 0 8px !important;
  }
  main,
  .profile-layout {

  }
  .panel,
  .create-post,
  .post-card {

  }

  .kixuz-modal-grid {

  }
  .member-card {
    width: 100% !important;
    max-width: 340px;
  }
  .group-banner {

  }
  .group-avatar {

  }
}

    </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand" aria-label="KIXUZ Inicio">
      <img src="img/logo-kixuz.png" alt="Logo KIXUZ" style="height: 34px;">
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="perfil.html">Mi Personaje</a>
      <a href="universo.html">Universos</a>
      <a href="familia.html">Familia / Clan</a>
    </nav>
    <div class="user-menu">
      <select id="activeCharSelect" class="dropdown" aria-label="Personaje activo"></select>
      <a href="registro.html">Entrar</a>
    </div>
  </header>

  <main class="profile-layout">
    <aside class="character-sidebar" id="characterSidebar"></aside>

    <section class="profile-wall">
      <div class="create-post" id="profileCreatePost">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
          <div id="profileComposerHint" style="font-size:12px;color:var(--acento);font-weight:700;"></div>
          <div class="mode-switch-group" id="profilePostModeSwitch" data-mode="IC">
            <button type="button" class="mode-btn ic active" data-pmode="IC">IC</button>
            <button type="button" class="mode-btn oc" data-pmode="OC">OC</button>
          </div>
        </div>
        <textarea id="profileWallInput" placeholder="Escribe una escena o crónica en este perfil..."></textarea>
        <div class="create-post-controls">
          <select id="profilePostUniverse" aria-label="Universo">
            <option value="">Sin universo (solo muro/inicio)</option>
          </select>
          <select id="profilePostScope" aria-label="Visibilidad / Familia o Clan">
            <option value="global">Público</option>
            <option value="familia">Familia / Clan</option>
          </select>
          <input type="text" id="profilePostFamilyTag" placeholder="Vínculo familiar o clan (opcional)">
        </div>
        <div class="create-post-footer">
          <button type="button" class="btn-publish" id="profileWallPublish">Publicar</button>
        </div>
      </div>
      <div id="profileWallFeed"></div>
    </section>
  </main>

  <script>
    (() => {
      const KEY_LISTA = 'kixuz_subpersonajes';
      const KEY_ACTIVO = 'kixuz_personaje_activo';
      const KEY_AMIGOS = 'kixuz_amigos_v1';

      const SVG_FLAME = `
        <svg class="kix-flame-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2.5c2.5 3.4 5.5 5.6 5.5 10.2a5.5 5.5 0 0 1-11 0c0-2.6 1.2-4.6 2.8-6.4-.2 1.8.6 3.1 1.7 3.5-.3-2.5.4-5.2 1-7.3z"></path>
        </svg>
      `;

      const SVG_ICON = {
        uni: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-25 12 12)"/></svg>`,
        clan: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v6c0 5-3.5 7.8-8 9-4.5-1.2-8-4-8-9V7l8-4z"/></svg>`,
        img: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
        edit: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
        addFriend: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`,
        twoPeople: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`
      };

      const PERSONAJE_VACIO = {
        esPlaceholder: true, nombre: 'Sin personaje', handle: '@nuevo_personaje',
        genero: '—', orientacion: '—', especies: [], edadAparente: '—', edadReal: '—',
        ocupacion: '—', clan: '', universos: ['#KIXUZ'], estadoSentimentalTipo: '',
        estadoSentimentalHandle: '', bio: 'Aún no tienes sub-personajes creados.',
        habilidades: [], debilidades: [], avatar: '', banner: '', fondoImagen: ''
      };

      const esc = str => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const normH = v => {
        const s = String(v || '').trim().toLowerCase().replace(/^@+/, '').replace(/\s+/g, '_');
        return s ? '@' + s : '';
      };

      let personajeVistaActual = null;
      let activoMenuActual = null;
      let likedSet = new Set();

      document.querySelectorAll('#profilePostModeSwitch .mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = btn.dataset.pmode;
          const sw = document.getElementById('profilePostModeSwitch');
          sw.dataset.mode = m;
          sw.querySelector('[data-pmode="IC"]').classList.toggle('active', m === 'IC');
          sw.querySelector('[data-pmode="OC"]').classList.toggle('active', m === 'OC');
        });
      });

      function comprimirImagen(file, maxAncho, calidad) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = reject;
          reader.onload = e => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
              let w = img.width, h = img.height;
              if (w > maxAncho) { h = Math.round((h * maxAncho) / w); w = maxAncho; }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', calidad));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function leerAmigosLocal() {
        try {
          const arr = JSON.parse(localStorage.getItem(KEY_AMIGOS) || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch { return []; }
      }

      function guardarAmigosLocal(arr) {
        try { localStorage.setItem(KEY_AMIGOS, JSON.stringify(arr)); } catch {}
      }

      function obtenerEstadoAmistadLocal(miHandle, otroHandle) {
        const yo = normH(miHandle);
        const otro = normH(otroHandle);
        if (!yo || !otro || yo === otro) return { estado: 'ninguno', solicitud: null };
        const lista = leerAmigosLocal();
        const aceptada = lista.find(a =>
          a.estado === 'aceptada' &&
          ((normH(a.deHandle) === yo && normH(a.paraHandle) === otro) ||
           (normH(a.deHandle) === otro && normH(a.paraHandle) === yo))
        );
        if (aceptada) return { estado: 'amigo', solicitud: aceptada };
        const enviada = lista.find(a => a.estado === 'pendiente' && normH(a.deHandle) === yo && normH(a.paraHandle) === otro);
        if (enviada) return { estado: 'enviada', solicitud: enviada };
        const recibida = lista.find(a => a.estado === 'pendiente' && normH(a.deHandle) === otro && normH(a.paraHandle) === yo);
        if (recibida) return { estado: 'recibida', solicitud: recibida };
        return { estado: 'ninguno', solicitud: null };
      }

      async function enviarSolicitudAmistad(deObj, paraObj) {
        const deH = normH(deObj?.handle);
        const paraH = normH(paraObj?.handle);
        if (!deH || !paraH || deH === paraH) return;
        const lista = leerAmigosLocal();
        if (!lista.some(a => normH(a.deHandle) === deH && normH(a.paraHandle) === paraH && a.estado !== 'rechazada')) {
          lista.unshift({
            id: 'ami_' + Date.now(),
            deNombre: deObj?.nombre || deH.slice(1), deHandle: deH,
            paraNombre: paraObj?.nombre || paraH.slice(1), paraHandle: paraH,
            estado: 'pendiente'
          });
          guardarAmigosLocal(lista);
        }
        window.KIXUZ_NOTIF?.registrar?.({
          destinoHandle: paraH,
          actorNombre: deObj?.nombre || deH.slice(1),
          actorHandle: deH,
          texto: 'te envió una solicitud de amistad.',
          enlace: `perfil.html?char=${encodeURIComponent(paraH)}`,
          tipo: 'amistad'
        });
        if (window.KIXUZ_AMIGOS?.enviarSolicitud) {
          try { await window.KIXUZ_AMIGOS.enviarSolicitud(paraObj); } catch {}
        }
      }

      async function aceptarSolicitudAmistad(id) {
        const lista = leerAmigosLocal();
        const item = lista.find(a => String(a.id) === String(id));
        if (item) {
          item.estado = 'aceptada';
          guardarAmigosLocal(lista);
          window.KIXUZ_NOTIF?.registrar?.({
            destinoHandle: item.deHandle,
            actorNombre: item.paraNombre || item.paraHandle.slice(1),
            actorHandle: item.paraHandle,
            texto: 'aceptó tu solicitud de amistad.',
            enlace: `perfil.html?char=${encodeURIComponent(item.paraHandle)}`,
            tipo: 'amistad'
          });
        }
        if (window.KIXUZ_AMIGOS?.aceptarSolicitud) {
          try { await window.KIXUZ_AMIGOS.aceptarSolicitud(id); } catch {}
        }
      }

      function obtenerPersonajes() {
        let guardados = [];
        try { guardados = JSON.parse(localStorage.getItem(KEY_LISTA) || '[]'); } catch {}
        if (Array.isArray(guardados) && guardados.length > 0) {
          const mapa = new Map();
          guardados.forEach(p => { if (p && p.handle) mapa.set(normH(p.handle), { ...p, handle: normH(p.handle) }); });
          if (mapa.size > 0) return Array.from(mapa.values());
        }
        return [{ ...PERSONAJE_VACIO }];
      }

      function obtenerActivoMenu(lista) {
        try {
          const raw = localStorage.getItem(KEY_ACTIVO);
          if (raw) {
            const parsed = JSON.parse(raw);
            const found = lista.find(p => normH(p.handle) === normH(parsed?.handle));
            if (found) return found;
          }
        } catch {}
        return lista[0];
      }

      async function obtenerPersonajeVista(lista, activoMenu) {
        const params = new URLSearchParams(window.location.search);
        const charUrl = params.get('char');
        if (charUrl) {
          const h = normH(charUrl);
          const found = lista.find(p => normH(p.handle) === h);
          if (found) return found;
          if (window.KIXUZ_DB?.buscarPersonajePublico) {
            try {
              const pub = await window.KIXUZ_DB.buscarPersonajePublico(h);
              if (pub) return { ...pub, handle: normH(pub.handle || h) };
            } catch {}
          }
          return { ...PERSONAJE_VACIO, nombre: h.replace(/^@/, ''), handle: h, bio: 'Perfil visitado.' };
        }
        return activoMenu;
      }

      function guardarActivoMenu(personaje) {
        try {
          if (personaje.esPlaceholder) localStorage.removeItem(KEY_ACTIVO);
          else localStorage.setItem(KEY_ACTIVO, JSON.stringify(personaje));
        } catch {}
        window.KIXUZ_ACTIVE_CHAR = personaje;
      }

      async function guardarPersonajeActualizado(actualizado) {
        const clean = { ...actualizado, handle: normH(actualizado.handle) };
        delete clean.esPlaceholder;
        let guardados = [];
        try { guardados = JSON.parse(localStorage.getItem(KEY_LISTA) || '[]'); } catch {}
        const filtrados = guardados.filter(p => normH(p.handle) !== clean.handle);
        filtrados.push(clean);
        localStorage.setItem(KEY_LISTA, JSON.stringify(filtrados));

        localStorage.setItem(KEY_ACTIVO, JSON.stringify(clean));
        window.KIXUZ_ACTIVE_CHAR = clean;
        activoMenuActual = clean;
        personajeVistaActual = clean;

        if (window.KIXUZ_DB?.guardarSubpersonaje) {
          try { await window.KIXUZ_DB.guardarSubpersonaje(clean); } catch {}
        }
        window.dispatchEvent(new Event('kixuz:personajes-actualizados'));
        aplicarFondo(clean);
        actualizarPerfil(clean, normH(clean.handle) !== normH(activoMenuActual?.handle));
      }

      function parseStatsText(txt) {
        return String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
          const m = line.match(/^(.+?)(?:[:\-\s]+(\d{1,3}))?$/);
          const nombre = (m?.[1] || line).trim();
          const val = Math.max(1, Math.min(100, Number(m?.[2] || 50)));
          return { nombre, valor: val };
        });
      }

      function formatStatsText(arr) {
        return (Array.isArray(arr) ? arr : []).map(it => {
          if (typeof it === 'string') return it;
          return `${it.nombre}: ${Math.max(1, Math.min(100, Number(it.valor || 50)))}`;
        }).join('\n');
      }

      // Obtiene la relación exacta de pareja (ej. "Casado con: @liam_miller")
      function obtenerRelacionPareja(personaje) {
        if (personaje.estadoSentimentalTipo && personaje.estadoSentimentalHandle) {
          const label = String(personaje.estadoSentimentalTipo).trim().replace(/:?$/, ':');
          return { texto: label, handle: normH(personaje.estadoSentimentalHandle) };
        }
        try {
          const fam = JSON.parse(localStorage.getItem('kixuz_familia_clan_v1') || '{}');
          const match = (fam.familia || []).find(m =>
            normH(m?.duenoHandle) === normH(personaje.handle) &&
            /casad|pareja|espos|marido|compromet/i.test(String(m?.relacion || ''))
          );
          if (match && match.handle) {
            const relClean = String(match.relacion || '').trim();
            const label = /^casad/i.test(relClean) ? 'Casado con:' : (relClean.endsWith(':') ? relClean : relClean + ':');
            return { texto: label, handle: normH(match.handle) };
          }
        } catch {}
        return null;
      }

      function obtenerEtiquetasFamiliaPersonaje(personaje) {
        const target = normH(personaje?.handle);
        if (!target || personaje?.esPlaceholder) return [];
        const set = new Set();

        try {
          const fam = JSON.parse(localStorage.getItem('kixuz_familia_clan_v1') || '{}');
          const mapF = fam.miembrosFamiliaEtiquetas?.[target];
          const tieneMapaExplicit = mapF && typeof mapF === 'object' && Object.keys(mapF).length > 0;

          if (tieneMapaExplicit) {
            Object.entries(mapF).forEach(([etq, ok]) => {
              const val = String(etq || '').trim();
              if (ok && val && !/prueba|sector4/i.test(val)) set.add(val);
            });
          }

          if (Array.isArray(fam.familia)) {
            fam.familia.forEach(m => {
              if (normH(m?.handle) === target) {
                const etqM = String(m.etiquetaFamilia || '').trim();
                if (etqM && !/prueba|sector4/i.test(etqM)) {
                  if (!tieneMapaExplicit || (mapF && mapF[etqM])) {
                    set.add(etqM);
                  }
                }
              }
            });
          }

          if (!set.size && !tieneMapaExplicit) {
            if (Array.isArray(personaje.familias)) {
              personaje.familias.forEach(x => {
                const val = String(x || '').trim();
                if (val && !/prueba|sector4/i.test(val)) set.add(val);
              });
            } else if (personaje.familiaNombre) {
              const val = String(personaje.familiaNombre).trim();
              if (val && !/prueba|sector4/i.test(val)) set.add(val);
            }
          }
        } catch {}

        return Array.from(set);
      }

      // Devuelve SOLO los clanes donde ESTE personaje (@handle) figura como miembro
      function obtenerPertenenciasClanFamilia(personaje) {
        const target = normH(personaje?.handle);
        if (!target || personaje?.esPlaceholder) return [];
        const set = new Set();

        try {
          const fam = JSON.parse(localStorage.getItem('kixuz_familia_clan_v1') || '{}');
          const mapC = fam.miembrosClanEtiquetas?.[target];
          const tieneMapaClan = mapC && typeof mapC === 'object' && Object.keys(mapC).length > 0;

          if (tieneMapaClan) {
            Object.entries(mapC).forEach(([cNom, ok]) => {
              const val = String(cNom || '').trim();
              if (ok && val && !/prueba|sector4/i.test(val)) set.add(val);
            });
          }

          if (Array.isArray(fam.clan)) {
            fam.clan.forEach(m => {
              if (normH(m?.handle) === target && m?.clanNombre) {
                const val = String(m.clanNombre).trim();
                if (val && !/prueba|sector4/i.test(val)) {
                  if (!tieneMapaClan || (mapC && mapC[val])) {
                    set.add(val);
                  }
                }
              }
            });
          }

          if (!set.size && !tieneMapaClan) {
            if (Array.isArray(personaje.clanes)) {
              personaje.clanes.forEach(c => {
                const val = String(c || '').trim();
                if (val && !/prueba|sector4/i.test(val)) set.add(val);
              });
            } else if (personaje.clan) {
              const val = String(personaje.clan).trim();
              if (val && !/prueba|sector4/i.test(val)) set.add(val);
            }
          }
        } catch {}

        return Array.from(set);
      }

      // Devuelve SOLO los universos donde ESTE personaje (@handle) está agregado como miembro
      function obtenerUniversosEnlazados(personaje) {
        const target = normH(personaje?.handle);
        if (!target || personaje?.esPlaceholder) return [];
        const set = new Set();

        if (window.KIXUZ_UNIVERSOS?.leerUniversos) {
          try {
            window.KIXUZ_UNIVERSOS.leerUniversos().forEach(u => {
              if (!u?.tag || /^#sector4$/i.test(String(u.tag).trim())) return;
              if (Array.isArray(u.miembros) && u.miembros.some(m => normH(m) === target)) {
                set.add(u.tag);
              }
            });
          } catch {}
        }

        if (Array.isArray(personaje.universos)) {
          personaje.universos.forEach(u => {
            if (!u) return;
            const tag = String(u).startsWith('#') ? String(u).trim() : '#' + String(u).trim().replace(/^#+/, '');
            if (!tag || /^#sector4$/i.test(tag) || /^#kixuz$/i.test(tag)) return;
            set.add(tag);
          });
        }

        return Array.from(set);
      }

                  </div>
                  <div style="display:flex;flex-direction:column;gap:5px;margin-top:2px;">
                    ${respuestas.map(r => {
                      const rModo = r.modo === 'OC' ? 'OC' : 'IC';
                      const rHandle = normH(r.autorHandle || '');
                      const rAutorHtml = rHandle
                        ? `<a href="perfil.html?char=${encodeURIComponent(rHandle)}" style="color:var(--acento);text-decoration:none;font-weight:700;">${esc(r.autorNombre || rHandle)} ${esc(rHandle)}</a>`
                        : `<strong>${esc(r.autorNombre || 'Rol')}</strong>`;
                      return `<div style="background:rgba(0,0,0,0.2);border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>${rAutorHtml}: ${esc(r.texto)}</span><span class="mode-badge ${rModo === 'OC' ? 'oc' : 'ic'}">${rModo}</span></div>`;
                    }).join('')}
                    <form class="comment-form" data-comment-post-id="${idPost}">
                      <input type="text" placeholder="Escribir comentario..." required>
                      <div class="mode-switch-group" data-comment-mode="IC">
                        <button type="button" class="mode-btn ic active" data-cmode="IC">IC</button>
                        <button type="button" class="mode-btn oc" data-cmode="OC">OC</button>
                      </div>
                      <button type="submit" class="comment-btn">Comentar</button>
                    </form>
                  </div>
                </article>
              `;
            }).join('')
          : `<div class="post-card" style="color:var(--muted);font-size:14px;">Sin publicaciones en este perfil todavía.</div>`;

        feed.querySelectorAll('.kix-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const postId = btn.dataset.kixPost;
            const ya = likedSet.has(String(postId));
            const delta = ya ? -1 : 1;
            if (ya) likedSet.delete(String(postId));
            else likedSet.add(String(postId));
            let postActualizado = null;
            ['kixuz_posts', 'kixuz_posts_v1'].forEach(key => {
              try {
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                if (!Array.isArray(arr)) return;
                let changed = false;
                arr.forEach(item => {
                  if (String(item.id) === String(postId)) {
                    item.kixiz = Math.max(0, Number(item.kixiz ?? item.kix ?? 0) + delta);
                    item.actualizadoEn = Date.now();
                    postActualizado = item;
                    changed = true;
                  }
                });
                if (changed) localStorage.setItem(key, JSON.stringify(arr));
              } catch {}
            });
            if (postActualizado && window.KIXUZ_DB?.guardarPostNube) {
              await window.KIXUZ_DB.guardarPostNube(postActualizado);
            }
            renderMuroPersonaje(personaje);
          });
        });

        feed.querySelectorAll('.comment-form').forEach(form => {
          const cSwitch = form.querySelector('.mode-switch-group');
          cSwitch?.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const m = btn.dataset.cmode;
              cSwitch.dataset.commentMode = m;
              cSwitch.querySelector('[data-cmode="IC"]').classList.toggle('active', m === 'IC');
              cSwitch.querySelector('[data-cmode="OC"]').classList.toggle('active', m === 'OC');
            });
          });

          form.addEventListener('submit', async e => {
            e.preventDefault();
            const postId = form.dataset.commentPostId;
            const inp = form.querySelector('input');
            const texto = (inp.value || '').trim();
            if (!texto) return;
            const cModo = cSwitch?.dataset.commentMode === 'OC' ? 'OC' : 'IC';
            const autor = getAutorActual(cModo);
            let postActualizado = null;

            ['kixuz_posts', 'kixuz_posts_v1'].forEach(key => {
              try {
                const arr = JSON.parse(localStorage.getItem(key) || '[]');
                if (!Array.isArray(arr)) return;
                let changed = false;
                arr.forEach(item => {
                  if (String(item.id) === String(postId)) {
                    item.respuestas = Array.isArray(item.respuestas) ? item.respuestas : [];
                    item.respuestas.push({ autorNombre: autor.nombre, autorHandle: autor.handle, modo: cModo, texto });
                    item.actualizadoEn = Date.now();
                    postActualizado = item;
                    changed = true;
                  }
                });
                if (changed) localStorage.setItem(key, JSON.stringify(arr));
              } catch {}
            });

            if (postActualizado) {
              if (normH(postActualizado.autorHandle) && normH(postActualizado.autorHandle) !== normH(autor.handle)) {
                window.KIXUZ_NOTIF?.registrar?.({
                  destinoHandle: postActualizado.autorHandle,
                  actorNombre: autor.nombre,
                  actorHandle: autor.handle,
                  texto: 'comentó tu publicación.',
                  enlace: `perfil.html?char=${encodeURIComponent(normH(postActualizado.perfilDestinoHandle || postActualizado.autorHandle))}`,
                  tipo: 'comentario'
                });
              }
              if (window.KIXUZ_DB?.guardarPostNube) {
                await window.KIXUZ_DB.guardarPostNube(postActualizado);
              }
            }

            inp.value = '';
            renderMuroPersonaje(personaje);
          });
        });
      }

      function renderAmigosDesplegable(personaje, esVistaSolo) {
        const listEl = document.getElementById('perfilAmigosLista');
        if (!listEl) return;

        const targetHandle = normH(personaje.handle);
        const todas = leerAmigosLocal();
        const amigos = [];
        const recibidas = [];

        todas.forEach(a => {
          if (!a) return;
          if (a.estado === 'aceptada') {
            if (normH(a.deHandle) === targetHandle) amigos.push({ nombre: a.paraNombre || a.paraHandle, handle: normH(a.paraHandle) });
            else if (normH(a.paraHandle) === targetHandle) amigos.push({ nombre: a.deNombre || a.deHandle, handle: normH(a.deHandle) });
          } else if (a.estado === 'pendiente' && normH(a.paraHandle) === targetHandle) {
            recibidas.push(a);
          }
        });

        let html = '';
        if (!esVistaSolo && recibidas.length) {
          html += recibidas.map(r => `
            <div class="friend-row-item" style="border-color:var(--acento);">
              <div>
                <strong>${esc(r.deNombre || r.deHandle)}</strong> <span style="opacity:0.75;">${esc(r.deHandle)}</span>
                <div style="font-size:10.5px;color:var(--acento);">Solicitud de amistad</div>
              </div>
              <div style="display:flex;gap:4px;">
                <button type="button" class="comment-btn" style="background:var(--acento);color:#150A24;padding:4px 8px;" data-acc-friend="${esc(r.id)}">Aceptar</button>
                <button type="button" class="comment-btn" style="padding:4px 8px;" data-rej-friend="${esc(r.id)}">Rechazar</button>
              </div>
            </div>
          `).join('');
        }

        if (amigos.length) {
          html += amigos.map(a => `
            <div class="friend-row-item">
              <a href="perfil.html?char=${encodeURIComponent(a.handle)}">${esc(a.nombre)} <span style="opacity:0.75;">(${esc(a.handle)})</span></a>
            </div>
          `).join('');
        } else if (!recibidas.length) {
          html += `<div style="font-size:12px;opacity:0.7;margin-top:6px;">Sin amigos enlazados todavía.</div>`;
        }

        listEl.innerHTML = html;

        listEl.querySelectorAll('[data-acc-friend]').forEach(btn => {
          btn.addEventListener('click', async () => {
            await aceptarSolicitudAmistad(btn.dataset.accFriend);
            actualizarPerfil(personaje, esVistaSolo);
          });
        });
        listEl.querySelectorAll('[data-rej-friend]').forEach(btn => {
          btn.addEventListener('click', () => {
            guardarAmigosLocal(leerAmigosLocal().filter(x => String(x.id) !== String(btn.dataset.rejFriend)));
            actualizarPerfil(personaje, esVistaSolo);
          });
        });
      }

      function renderListaStats(arr, esDebilidad) {
        const items = Array.isArray(arr) ? arr : [];
        if (!items.length) return `<div style="font-size:12px;opacity:0.7;margin-top:6px;">Sin registros todavía.</div>`;
        return items.map(it => {
          const nombre = typeof it === 'string' ? it : (it.nombre || 'Rasgo');
          const valor = typeof it === 'string' ? 50 : Math.max(1, Math.min(100, Number(it.valor || 50)));
          return `
            <div class="stat-row">
              <div class="stat-row-top">
                <span>${esc(nombre)}</span>
                <strong style="color:${esDebilidad ? '#ff9bb4' : 'var(--acento)'};">${valor}/100</strong>
              </div>
              <div class="stat-bar-bg">
                <div class="stat-bar-fill ${esDebilidad ? 'weak' : ''}" style="width:${valor}%;"></div>
              </div>
            </div>
          `;
        }).join('');
      }

      function actualizarPerfil(personaje, esVistaSolo = false) {
        const sidebar = document.getElementById('characterSidebar');
        if (!sidebar) return;

        document.title = `${personaje.nombre} (${personaje.handle}) - KIXUZ`;

        const autorPreview = getAutorActual('IC');
        const hint = document.getElementById('profileComposerHint');
        if (hint) {
          hint.textContent = `Publicando como ${autorPreview.nombre} (${autorPreview.handle}) en el muro de ${personaje.nombre} (${personaje.handle})`;
        }

        const selUni = document.getElementById('profilePostUniverse');
        if (selUni) {
          const unis = new Set();
          (personaje.universos || []).forEach(u => { if (u) unis.add(u.startsWith('#') ? u : '#' + u.replace(/^#+/, '')); });
          if (window.KIXUZ_UNIVERSOS?.leerUniversos) {
            try {
              window.KIXUZ_UNIVERSOS.leerUniversos().forEach(u => { if (u?.tag) unis.add(u.tag); });
            } catch {}
          }
          selUni.innerHTML = `<option value="">Sin universo (solo muro/inicio)</option>` +
            Array.from(unis).map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
        }

        // Relación exacta al lado del @usuario (ej. "Casado con: @liam_miller")
        const pareja = obtenerRelacionPareja(personaje);
        const parejaInlineHtml = pareja
          ? `<span class="inline-partner-rel">· ${esc(pareja.texto)} <a href="perfil.html?char=${encodeURIComponent(pareja.handle)}">${esc(pareja.handle)}</a></span>`
          : '';

        // Solo muestra etiquetas de Familia o Clan que correspondan a este personaje
        const etiquetasFam = obtenerEtiquetasFamiliaPersonaje(personaje);
        const familiaLinkHtml = etiquetasFam.map(nomF =>
          `<a href="familia.html?char=${encodeURIComponent(personaje.handle)}#familia" class="info-tag">${SVG_ICON.clan} ${esc(nomF)}</a>`
        ).join('');

        const pertenencias = obtenerPertenenciasClanFamilia(personaje);
        const clanesLinksHtml = pertenencias.map(nom =>
          `<a href="familia.html?char=${encodeURIComponent(personaje.handle)}#clan:${encodeURIComponent(nom)}" class="info-tag">${SVG_ICON.clan} ${esc(nom)}</a>`
        ).join('');

        const universosEnlazados = obtenerUniversosEnlazados(personaje);
        const universosHTML = universosEnlazados.map(u => {
          const slug = String(u).replace(/^#/, '');
          return `<a href="universo.html?u=${encodeURIComponent(slug)}" class="info-tag">${SVG_ICON.uni} ${esc(u)}</a>`;
        }).join('');

        // Botón SVG de amistad SOLO en perfiles de otros personajes (nunca en el propio)
        let friendTopBtnHtml = '';
        if (esVistaSolo && activoMenuActual && !activoMenuActual.esPlaceholder && normH(activoMenuActual.handle) !== normH(personaje.handle)) {
          const relAm = obtenerEstadoAmistadLocal(activoMenuActual.handle, personaje.handle);
          if (relAm.estado === 'amigo') {
            friendTopBtnHtml = `<button type="button" class="friend-icon-btn is-friend" title="Ya son amigos">${SVG_ICON.twoPeople}<span>Amigos</span></button>`;
          } else if (relAm.estado === 'enviada') {
            friendTopBtnHtml = `<button type="button" class="friend-icon-btn" disabled title="Solicitud enviada">${SVG_ICON.addFriend}<span>Enviada</span></button>`;
          } else if (relAm.estado === 'recibida') {
            friendTopBtnHtml = `<button type="button" class="friend-icon-btn" id="btnAceptarAmistadTop" title="Aceptar solicitud">${SVG_ICON.addFriend}<span>Aceptar</span></button>`;
          } else {
            friendTopBtnHtml = `<button type="button" class="friend-icon-btn" id="btnAgregarAmigoTop" title="Agregar amigo">${SVG_ICON.addFriend}</button>`;
          }
        }

        const bannerStyle = personaje.banner ? `style="background-image:url('${personaje.banner}');"` : '';
        const avatarStyle = personaje.avatar ? `style="background-image:url('${personaje.avatar}');"` : '';
        const inicialAvatar = personaje.avatar ? '' : (personaje.nombre || 'K').charAt(0).toUpperCase();

        const botonesEdicionHtml = (!esVistaSolo && !personaje.esPlaceholder) ? `
          <div class="kixuz-profile-edit-bar">
            <button type="button" class="kixuz-edit-btn" id="btnEditarFicha">${SVG_ICON.edit} Editar info</button>
            <button type="button" class="kixuz-edit-btn" id="btnEditarImagenes">${SVG_ICON.img} Editar fotos</button>
          </div>
        ` : '';

        sidebar.innerHTML = `
          <div class="card-banner" ${bannerStyle}></div>
          <div class="character-identity">
            <div class="avatar-top-bar">
              <div class="avatar-circle" ${avatarStyle}>${esc(inicialAvatar)}</div>
              ${friendTopBtnHtml}
            </div>
            <h1>${esc(personaje.nombre)}</h1>
            <div class="profile-username-row">
              <span class="profile-username">${esc(personaje.handle)}</span>
              ${parejaInlineHtml}
            </div>
            <div class="tags-container">${familiaLinkHtml}${clanesLinksHtml}${universosHTML}</div>
            ${botonesEdicionHtml}
          </div>

          <details open>
            <summary>Biografía</summary>
            <p style="font-size:13px;margin-top:8px;">${esc(personaje.bio || 'Sin descripción todavía.')}</p>
          </details>

          <details open>
            <summary>Info & Especie</summary>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12.5px;margin-top:8px;">
              <div style="grid-column:1/-1;"><strong>Especie(s):</strong> ${esc((personaje.especies || []).join(' / ') || '—')}</div>
              <div><strong>Género:</strong> ${esc(personaje.genero || '—')}</div>
              <div><strong>Edad:</strong> ${esc(personaje.edadAparente || personaje.edadReal || '—')}</div>
            </div>
          </details>

          <details>
            <summary>Habilidades (1/100)</summary>
            ${renderListaStats(personaje.habilidades, false)}
          </details>

          <details>
            <summary>Debilidades (1/100)</summary>
            ${renderListaStats(personaje.debilidades, true)}
          </details>

          <details open>
            <summary>${SVG_ICON.twoPeople} Amigos</summary>
            <div id="perfilAmigosLista"></div>
          </details>
        `;

        document.getElementById('btnEditarFicha')?.addEventListener('click', () => abrirModalEditarFicha(personaje));
        document.getElementById('btnEditarImagenes')?.addEventListener('click', () => abrirModalEditarImagenes(personaje));

        if (esVistaSolo) {
          document.getElementById('btnAgregarAmigoTop')?.addEventListener('click', async () => {
            await enviarSolicitudAmistad(activoMenuActual, personaje);
            actualizarPerfil(personaje, esVistaSolo);
          });
          document.getElementById('btnAceptarAmistadTop')?.addEventListener('click', async () => {
            const rel = obtenerEstadoAmistadLocal(activoMenuActual.handle, personaje.handle);
            if (rel?.solicitud?.id) {
              await aceptarSolicitudAmistad(rel.solicitud.id);
              actualizarPerfil(personaje, esVistaSolo);
            }
          });
        }

        renderAmigosDesplegable(personaje, esVistaSolo);
        renderMuroPersonaje(personaje);
      }

      document.getElementById('profileWallPublish')?.addEventListener('click', async () => {
        const input = document.getElementById('profileWallInput');
        const uniSel = document.getElementById('profilePostUniverse');
        const scopeSel = document.getElementById('profilePostScope');
        const famInp = document.getElementById('profilePostFamilyTag');
        const modeSw = document.getElementById('profilePostModeSwitch');
        const txt = (input?.value || '').trim();
        if (!txt || !personajeVistaActual) return;

        const modo = modeSw?.dataset.mode === 'OC' ? 'OC' : 'IC';
        const autor = getAutorActual(modo);
        const destinoH = normH(personajeVistaActual.handle);

        const nuevo = {
          id: 'post_' + Date.now(),
          autorNombre: autor.nombre,
          autorHandle: autor.handle,
          perfilDestinoHandle: destinoH,
          perfilDestinoNombre: personajeVistaActual.nombre || destinoH.slice(1),
          modo,
          contenido: txt,
          universo: (uniSel?.value || '').trim(),
          alcanceTipo: scopeSel?.value || 'global',
          alcanceValor: (famInp?.value || '').trim(),
          createdAtMs: Date.now(),
          actualizadoEn: Date.now(),
          tiempo: 'Ahora mismo',
          kixiz: 0,
          respuestas: []
        };

        let posts = [];
        try { posts = JSON.parse(localStorage.getItem('kixuz_posts') || '[]'); } catch {}
        posts.unshift(nuevo);
        localStorage.setItem('kixuz_posts', JSON.stringify(posts));

        if (destinoH && destinoH !== normH(autor.handle)) {
          window.KIXUZ_NOTIF?.registrar?.({
            destinoHandle: destinoH,
            actorNombre: autor.nombre,
            actorHandle: autor.handle,
            texto: 'publicó en tu muro.',
            enlace: `perfil.html?char=${encodeURIComponent(destinoH)}`,
            tipo: 'muro'
          });
        }

        if (window.KIXUZ_DB?.guardarPostNube) {
          await window.KIXUZ_DB.guardarPostNube(nuevo);
        }

        input.value = '';
        if (famInp) famInp.value = '';
        renderMuroPersonaje(personajeVistaActual);
      });

      async function sincronizarSelectores() {
        const lista = obtenerPersonajes();
        const activoMenu = obtenerActivoMenu(lista);
        const personajeVista = await obtenerPersonajeVista(lista, activoMenu);
        activoMenuActual = activoMenu;
        personajeVistaActual = personajeVista;
        const esVistaSolo = normH(personajeVista.handle) !== normH(activoMenu.handle);
        guardarActivoMenu(activoMenu);
        aplicarFondo(personajeVista);

        document.querySelectorAll('select.dropdown, #activeCharSelect').forEach(select => {
          select.innerHTML = '';
          lista.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.handle;
            opt.textContent = p.esPlaceholder ? 'Sin personaje' : `${p.nombre} (${p.handle})`;
            select.appendChild(opt);
          });
          const optCM = document.createElement('option');
          optCM.value = '__cuenta_maestra__';
          optCM.textContent = 'Mi Cuenta Maestra';
          select.appendChild(optCM);

          const optNuevo = document.createElement('option');
          optNuevo.value = '__nuevo__';
          optNuevo.textContent = '+ Crear personaje';
          select.appendChild(optNuevo);
          select.value = activoMenu.handle;

          select.onchange = () => {
            if (select.value === '__cuenta_maestra__') { window.location.href = 'cuenta-maestra.html'; return; }
            if (select.value === '__nuevo__') { window.location.href = 'crear-personaje.html'; return; }
            const elegido = lista.find(p => normH(p.handle) === normH(select.value));
            if (elegido) {
              guardarActivoMenu(elegido);
              window.location.href = `perfil.html?char=${encodeURIComponent(elegido.handle)}`;
            }
          };
        });

        actualizarPerfil(personajeVista, esVistaSolo);
      }

      window.addEventListener('kixuz:personajes-actualizados', sincronizarSelectores);
      window.addEventListener('kixuz:posts-actualizados', () => {
        if (personajeVistaActual) renderMuroPersonaje(personajeVistaActual);
      });
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sincronizarSelectores);
      else sincronizarSelectores();
    })();
  </script>
